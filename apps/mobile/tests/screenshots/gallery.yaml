appId: com.openpost.app
---
- launchApp
- openLink: com.openpost.app://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081
- runFlow:
    when:
      visible: "Open in.*OpenPost.*"
    commands:
      - tapOn: Open
- extendedWaitUntil:
    visible: Recent drafts
    timeout: 120000
- tapOn: ".*Draft idea.*"
- inputText: Today we launched a simpler way to turn our work into content.
- hideKeyboard
- takeScreenshot: ${OUTPUT}/drafts-${SCHEME}
- tapOn: Calendar
- assertVisible: October 2026
- takeScreenshot: ${OUTPUT}/calendar-${SCHEME}
- tapOn: Queue
- assertVisible: "Upcoming.*"
- takeScreenshot: ${OUTPUT}/queue-${SCHEME}
- tapOn: Video
- assertVisible: Record video
- assertVisible: Recent projects
- takeScreenshot: ${OUTPUT}/video-${SCHEME}
- tapOn: Analytics
- assertVisible: Followers
- assertVisible: Daily views
- takeScreenshot: ${OUTPUT}/analytics-${SCHEME}
- tapOn: Drafts
- tapOn: ".*A few thoughts on building in public.*"
- assertVisible: ".*Social Set.*"
- assertVisible: Queue next slot
- takeScreenshot: ${OUTPUT}/composer-${SCHEME}
