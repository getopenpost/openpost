# Coolify Docker Compose build pack: base directory `/`, Compose location
# `deploy/coolify/docker-compose.yml`. Add each ${...} value as a Runtime
# environment variable.
services:
  openpost:
    image: ghcr.io/getopenpost/openpost:latest
    restart: unless-stopped
    stop_grace_period: 15s
    expose:
      - "8080"
    volumes:
      - openpost_data:/data
    environment:
      OPENPOST_PORT: 8080
      OPENPOST_DATABASE_PATH: /data/db/openpost.db
      OPENPOST_MEDIA_PATH: /data/media
      OPENPOST_APP_URL: ${OPENPOST_APP_URL}
      OPENPOST_PUBLIC_URL: ${OPENPOST_PUBLIC_URL}
      OPENPOST_MEDIA_URL: ${OPENPOST_MEDIA_URL}
      OPENPOST_JWT_SECRET: ${OPENPOST_JWT_SECRET}
      OPENPOST_ENCRYPTION_KEY: ${OPENPOST_ENCRYPTION_KEY}
      OPENPOST_DISABLE_REGISTRATIONS: ${OPENPOST_DISABLE_REGISTRATIONS:-false}
    # Process liveness only. Gate traffic and rollouts on /api/v1/ready.
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/api/v1/health",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  openpost_data:
