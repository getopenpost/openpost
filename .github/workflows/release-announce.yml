name: Announce Release

# Announcements fire on the publication event itself, never as a tail job of
# the release pipeline. A skipped or retried pipeline cannot silently drop the
# announcement, and a manually completed publication can be announced through
# the manual trigger below.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag to announce (e.g. v4.34.1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-announce-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  announce-discord:
    name: Announce release in Discord
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Post the release announcement
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
            echo "::notice::DISCORD_RELEASE_WEBHOOK_URL is not configured; skipping the Discord announcement."
            exit 0
          fi

          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json body,publishedAt,tagName,url \
            > release.json

          jq -n \
            --arg tag "$(jq -r '.tagName' release.json)" \
            --arg url "$(jq -r '.url' release.json)" \
            --arg body "$(jq -r '.body // ""' release.json)" \
            --arg published_at "$(jq -r '.publishedAt' release.json)" \
            --arg repository "$GITHUB_REPOSITORY" \
            '
              ($body | if length == 0 then
                "See what changed and download the release assets."
              elif length > 3500 then
                .[0:3400] + "\n\n…"
              else
                .
              end) as $summary
              | {
                  username: "OpenPost Releases",
                  avatar_url: "https://avatars.githubusercontent.com/u/316708436?v=4",
                  allowed_mentions: { parse: [] },
                  embeds: [
                    {
                      title: ("🚀 OpenPost " + $tag + " is live"),
                      url: $url,
                      description: ($summary + "\n\n**[Read the full release notes](" + $url + ")**"),
                      color: 12012549,
                      thumbnail: {
                        url: "https://avatars.githubusercontent.com/u/316708436?v=4"
                      },
                      fields: [
                        {
                          name: "Version",
                          value: ("`" + $tag + "`"),
                          inline: true
                        },
                        {
                          name: "Use OpenPost",
                          value: "[Open the app](https://app.openpo.st) · [Self-host](https://openpo.st/docs/guide/quickstart)",
                          inline: true
                        }
                      ],
                      footer: { text: $repository },
                      timestamp: $published_at
                    }
                  ]
                }
            ' > discord-payload.json

          curl --fail-with-body --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 30 \
            --header 'Content-Type: application/json' \
            --data-binary @discord-payload.json \
            "${DISCORD_WEBHOOK_URL}?wait=true" \
            > /dev/null
