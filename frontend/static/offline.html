<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#faf9f7" />
    <title>You're offline | OpenPost</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
        background: #faf9f7;
        color: #302b28;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
      }
      main {
        max-width: 28rem;
        padding: 1.5rem;
      }
      h1 {
        font-size: 1.5rem;
      }
      p {
        line-height: 1.6;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        color: inherit;
        text-underline-offset: 0.25em;
      }
      a:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 4px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          background: #211e1b;
          color: #eeeae5;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p>OpenPost</p>
      <h1>You're offline</h1>
      <p>
        This page isn't available on this device yet. Reconnect to open it. Your
        saved local projects remain on this device.
      </p>
      <a href="">Try again</a>
    </main>
  <script>
    // This fallback has no application bundles. Keep its copy local so it also
    // works when a language's application bundle has never been downloaded.
    const translations = {
      pt: ["Está offline", "Esta página ainda não está disponível neste dispositivo. Volte a ligar-se para a abrir. Os seus projetos locais guardados continuam neste dispositivo.", "Tentar novamente"],
      "pt-br": ["Você está offline", "Esta página ainda não está disponível neste dispositivo. Reconecte-se para abri-la. Seus projetos locais salvos permanecem neste dispositivo.", "Tentar novamente"],
      es: ["Sin conexión", "Esta página aún no está disponible en este dispositivo. Vuelve a conectarte para abrirla. Tus proyectos locales guardados siguen en este dispositivo.", "Reintentar"],
      fr: ["Vous êtes hors ligne", "Cette page n’est pas encore disponible sur cet appareil. Reconnectez-vous pour l’ouvrir. Vos projets locaux enregistrés restent sur cet appareil.", "Réessayer"],
      de: ["Du bist offline", "Diese Seite ist auf diesem Gerät noch nicht verfügbar. Stelle die Verbindung wieder her, um sie zu öffnen. Deine lokal gespeicherten Projekte bleiben auf diesem Gerät.", "Erneut versuchen"],
      ja: ["オフラインです", "このページはまだこのデバイスで利用できません。再接続して開いてください。保存したローカルプロジェクトはこのデバイスに残っています。", "再試行"],
      ko: ["오프라인 상태입니다", "이 페이지는 아직 이 기기에서 사용할 수 없습니다. 다시 연결하여 여세요. 저장된 로컬 프로젝트는 이 기기에 남아 있습니다.", "다시 시도"],
      tr: ["Çevrimdışısınız", "Bu sayfa henüz bu cihazda kullanılamıyor. Açmak için yeniden bağlanın. Kaydedilmiş yerel projeleriniz bu cihazda kalır.", "Tekrar dene"],
      zh: ["您已离线", "此页面尚未在此设备上可用。请重新连接以打开。已保存的本地项目仍保留在此设备上。", "重试"]
    };
    const savedLocale = document.cookie.match(/(?:^|;\s*)PARAGLIDE_LOCALE=([^;]*)/)?.[1];
    const locales = [savedLocale, ...navigator.languages].filter(Boolean);
    for (const locale of locales) {
      const key = locale.toLowerCase();
      const language = translations[key] ? key : key.split('-')[0];
      if (language === 'en') break;
      const copy = translations[language];
      if (!copy) continue;
      document.documentElement.lang = language;
      document.title = copy[0] + ' | OpenPost';
      document.querySelector('h1').textContent = copy[0];
      document.querySelector('main p:last-of-type').textContent = copy[1];
      document.querySelector('a').textContent = copy[2];
      break;
    }
  </script>
  </body>
</html>
