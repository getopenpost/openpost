name: Build and Release

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  BUN_VERSION: "1.3.11"

permissions: {}

jobs:
  verify-candidate:
    name: Verify exact release candidate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      ci_run_id: ${{ steps.candidate.outputs.run_id }}
      frontend_artifact: ${{ steps.artifacts.outputs.frontend }}
      android_artifact: ${{ steps.artifacts.outputs.android }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Require a new Android release identity
        run: |
          previous_tag=""
          while IFS= read -r tag; do
            if [[ "$tag" != "$GITHUB_REF_NAME" ]]; then
              previous_tag="$tag"
              break
            fi
          done < <(git tag --list 'v*' --sort=-v:refname)
          [[ -n "$previous_tag" ]]
          mobile_config_path="apps/mobile/app.json"
          if ! git cat-file -e "$previous_tag:$mobile_config_path" 2>/dev/null; then
            mobile_config_path="mobile/app.json"
          fi
          git show "$previous_tag:$mobile_config_path" > previous-release-app.json
          bun scripts/mobile-release.mjs check \
            --config apps/mobile/app.json \
            --package apps/mobile/package.json \
            --previous-config previous-release-app.json
      - name: Require successful CI for the tagged SHA
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # The tag-triggered CI run starts alongside this release and builds
          # every candidate artifact. Wait for it, then require success.
          candidate=""
          for _ in $(seq 1 30); do
            candidate="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow CI \
              --commit "$GITHUB_SHA" \
              --event push \
              --limit 20 \
              --json databaseId,headBranch \
              --jq '[.[] | select(.headBranch == "'"$GITHUB_REF_NAME"'")][0].databaseId // empty' 2>/dev/null || true)"
            [[ -n "$candidate" ]] && break
            sleep 20
          done
          [[ -n "$candidate" ]] || {
            echo "No CI run exists for tag $GITHUB_REF_NAME on SHA $GITHUB_SHA." >&2
            exit 1
          }
          [[ "$candidate" =~ ^[0-9]+$ ]]
          gh run watch "$candidate" \
            --repo "$GITHUB_REPOSITORY" \
            --exit-status \
            --interval 30 > /dev/null
          echo "run_id=$candidate" >> "$GITHUB_OUTPUT"
      - name: Resolve artifacts from their successful CI attempts
        id: artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_RUN_ID: ${{ steps.candidate.outputs.run_id }}
        shell: bash
        run: |
          image="$(bun scripts/ci-artifacts.mjs resolve \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$CI_RUN_ID" \
            --prefix "image-digest-${GITHUB_SHA}-")"
          frontend="$(bun scripts/ci-artifacts.mjs resolve \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$CI_RUN_ID" \
            --prefix "frontend-public-${GITHUB_SHA}-")"
          android="$(bun scripts/ci-artifacts.mjs resolve \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$CI_RUN_ID" \
            --prefix "android-unsigned-${GITHUB_SHA}-")"
          {
            echo "image=$image"
            echo "frontend=$frontend"
            echo "android=$android"
          } >> "$GITHUB_OUTPUT"
      - name: Verify the tested image
        id: image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_RUN_ID: ${{ steps.candidate.outputs.run_id }}
          IMAGE_ARTIFACT: ${{ steps.artifacts.outputs.image }}
        shell: bash
        run: |
          gh run download "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$IMAGE_ARTIFACT" --dir tested-image
          digest="$(cat tested-image/image-digest.txt)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          image="${REGISTRY}/${IMAGE_NAME,,}@${digest}"
          docker pull "$image"
          [[ "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$image")" == "$GITHUB_REF_NAME" ]]
          [[ "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")" == "$GITHUB_SHA" ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  prepare-draft:
    name: Prepare reusable draft release
    runs-on: ubuntu-latest
    needs: verify-candidate
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Create or verify the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md
          fetch_release() {
            release_id="$(gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json databaseId \
              --jq '.databaseId' 2>/dev/null || true)"
            [[ "$release_id" =~ ^[0-9]+$ ]] || return 1
            gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" > draft-release.json
          }
          if ! fetch_release; then
            if ! gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md; then
              echo "Draft creation raced with another attempt; validating the resulting release." >&2
            fi
            fetch_release
          fi
          bun scripts/release-assets.mjs verify \
            --release-json draft-release.json \
            --tag "$GITHUB_REF_NAME" \
            --notes-file release-notes.md

  build-binaries:
    name: Build server (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [verify-candidate, prepare-draft]
    permissions:
      actions: read
      contents: write
    strategy:
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-latest, ext: "" }
          - { os: darwin, arch: arm64, runner: macos-latest, ext: "" }
          - { os: windows, arch: amd64, runner: ubuntu-latest, ext: ".exe" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - name: Download frontend built by candidate CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_RUN_ID: ${{ needs.verify-candidate.outputs.ci_run_id }}
          FRONTEND_ARTIFACT: ${{ needs.verify-candidate.outputs.frontend_artifact }}
        run: gh run download "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$FRONTEND_ARTIFACT" --dir apps/server/cmd/openpost/public
      - name: Build binary
        shell: bash
        run: |
          cd apps/server
          if [[ "${{ matrix.os }}" == windows ]]; then
            CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -buildvcs=false -ldflags="-s -w -X main.version=${GITHUB_REF_NAME} -X main.commit=${GITHUB_SHA}" -o ../../openpost-server-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} ./cmd/openpost
          else
            CGO_ENABLED=1 go build -buildvcs=false -ldflags="-s -w -X main.version=${GITHUB_REF_NAME} -X main.commit=${GITHUB_SHA}" -o ../../openpost-server-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} ./cmd/openpost
          fi
      - name: Upload server binary to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          bash scripts/release-asset-upload.sh \
            "openpost-server-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"

  build-cli:
    name: Build CLI (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [verify-candidate, prepare-draft]
    permissions:
      actions: read
      contents: write
    strategy:
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-latest, ext: "" }
          - { os: linux, arch: arm64, runner: ubuntu-latest, ext: "" }
          - { os: darwin, arch: arm64, runner: macos-latest, ext: "" }
          - { os: windows, arch: amd64, runner: ubuntu-latest, ext: ".exe" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum
      - name: Build CLI binaries
        shell: bash
        run: |
          cd apps/cli
          CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o ../../openpost-cli-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} ./cmd/openpost
          CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o ../../openpost-mcp-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} ./cmd/openpost-mcp
      - name: Upload CLI and MCP binaries to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          bash scripts/release-asset-upload.sh \
            "openpost-cli-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}" \
            "openpost-mcp-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"

  build-android:
    name: Sign Android candidate
    runs-on: ubuntu-latest
    needs: [verify-candidate, prepare-draft]
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Download the unsigned APK built by candidate CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_RUN_ID: ${{ needs.verify-candidate.outputs.ci_run_id }}
          ANDROID_ARTIFACT: ${{ needs.verify-candidate.outputs.android_artifact }}
        run: |
          gh run download "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ANDROID_ARTIFACT" --dir candidate-android
          cd candidate-android
          sha256sum --check openpost-app-android-unsigned.sha256
      - name: Check signing secret
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "has_keystore=$([[ -n "$KEYSTORE_B64" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Decode keystore
        if: steps.signing.outputs.has_keystore == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          clean=$(printf '%s' "$KEYSTORE_B64" | sed -e 's/^"//;s/"$//' -e "s/^'//;s/'$//" -e 's/^data:[^,]*,//' -e 's/\\n//g' -e 's/\\r//g' | tr -d '\n\r\t ')
          printf '%s' "$clean" | base64 -d > release-keystore.jks
      - name: Sign the verified candidate APK
        if: steps.signing.outputs.has_keystore == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          [[ -x "$apksigner" ]]
          "$apksigner" sign \
            --ks release-keystore.jks \
            --ks-pass env:STORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out openpost-app-android.apk \
            candidate-android/openpost-app-android-unsigned.apk
          "$apksigner" verify --verbose --print-certs openpost-app-android.apk
      - name: Refuse to publish an unsigned Android application
        if: steps.signing.outputs.has_keystore != 'true'
        run: |
          echo "Android release signing credentials are required for the installable release asset." >&2
          exit 1
      - name: Upload the Android APK to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          bash scripts/release-asset-upload.sh \
            openpost-app-android.apk

  promote-image:
    name: Promote tested image
    runs-on: ubuntu-latest
    needs: [verify-candidate, prepare-draft, build-binaries, build-cli, build-android]
    permissions:
      contents: write
      packages: write
    outputs:
      digest: ${{ steps.promote.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Require every draft release asset before promotion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md
          release_id="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json databaseId --jq '.databaseId')"
          [[ "$release_id" =~ ^[0-9]+$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" > draft-release.json
          bun scripts/release-assets.mjs verify \
            --release-json draft-release.json \
            --tag "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --complete
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Add release tags without rebuilding
        id: promote
        env:
          SOURCE_DIGEST: ${{ needs.verify-candidate.outputs.digest }}
        shell: bash
        run: |
          source_image="${REGISTRY}/${IMAGE_NAME}@${SOURCE_DIGEST}"
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "${REGISTRY}/${IMAGE_NAME}:${GITHUB_REF_NAME}" \
            --tag "${REGISTRY}/${IMAGE_NAME}:latest" \
            "$source_image"
          promoted_digest="$(docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${GITHUB_REF_NAME}" | awk '$1 == "Digest:" { print $2; exit }')"
          [[ "$promoted_digest" == "$SOURCE_DIGEST" ]] || {
            echo "Promoted digest $promoted_digest does not match verified candidate $SOURCE_DIGEST." >&2
            exit 1
          }
          echo "digest=$SOURCE_DIGEST" >> "$GITHUB_OUTPUT"

  deploy-production:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: promote-image
    timeout-minutes: 70
    steps:
      - name: Trigger the verified VPS deployment
        env:
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          IMAGE_DIGEST: ${{ needs.promote-image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          request_path=/hooks/deploy-openpost
          issued_at=$(date +%s)
          delivery_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}"
          payload=$(printf '{"repository":"%s","sha":"%s","tag":"%s","digest":"%s"}' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_REF_NAME" "$IMAGE_DIGEST")
          body_digest=$(printf '%s' "$payload" | openssl dgst -sha256 | awk '{print $2}')
          canonical_request=$(printf 'POST\n%s\n%s\n%s\n%s' \
            "$request_path" "$issued_at" "$delivery_id" "$body_digest")
          signature=$(printf '%s' "$canonical_request" | openssl dgst -sha256 -hmac "$DEPLOY_WEBHOOK_SECRET" | awk '{print "sha256=" $2}')
          response=$(curl --fail-with-body --silent --show-error \
            --connect-timeout 10 \
            --max-time 3660 \
            -H 'Content-Type: application/json' \
            -H "X-Deploy-Timestamp: $issued_at" \
            -H "X-Deploy-Delivery: $delivery_id" \
            -H "X-Deploy-Signature-256: $signature" \
            --data-binary "$payload" \
            "https://webhooks.rgo.pt$request_path")
          printf '%s\n' "$response"
          [ "$response" = '{"status":"completed"}' ]
      - name: Verify public readiness, version, and revision
        shell: bash
        run: |
          for _ in $(seq 1 60); do
            info=$(curl --fail --silent --connect-timeout 2 --max-time 5 https://app.openpo.st/api/v1/version 2>/dev/null || true)
            ready=$(curl --fail --silent --connect-timeout 2 --max-time 5 https://app.openpo.st/api/v1/ready 2>/dev/null || true)
            revision=$(jq -r '.revision // empty' <<<"$info" 2>/dev/null || true)
            version=$(jq -r '.version // empty' <<<"$info" 2>/dev/null || true)
            readiness=$(jq -r '.status // empty' <<<"$ready" 2>/dev/null || true)
            database=$(jq -r '.database // empty' <<<"$ready" 2>/dev/null || true)
            [[ "$revision" == "$GITHUB_SHA" && "$version" == "$GITHUB_REF_NAME" && "$readiness" == ready && "$database" == ok ]] && exit 0
            sleep 5
          done
          echo "Production did not become ready at $GITHUB_REF_NAME revision $GITHUB_SHA." >&2
          exit 1

  publish-n8n:
    name: Publish and verify n8n package
    runs-on: ubuntu-latest
    needs: deploy-production
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      N8N_SMOKE_VERSION: "2.35.7"
      NPM_CLI_VERSION: "12.0.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - name: Install the trusted-publishing npm CLI
        run: npm install --global "npm@${NPM_CLI_VERSION}"
      - run: bun install --frozen-lockfile
      - name: Check the exact package source before publication
        run: bun run check:n8n
      - name: Publish once or reconcile the existing registry version
        id: package
        run: bun scripts/n8n-package-release.mjs publish
      - name: Run the n8n community package scanner against npm
        shell: bash
        env:
          PACKAGE_SPEC: ${{ steps.package.outputs.package_spec }}
        run: |
          set -o pipefail
          npx --yes @n8n/scan-community-package@0.32.0 "$PACKAGE_SPEC" 2>&1 | tee n8n-package-scan.txt
          grep -F "has passed all security checks" n8n-package-scan.txt
      - name: Verify provenance, integrity, and a clean n8n install
        env:
          PACKAGE_SPEC: ${{ steps.package.outputs.package_spec }}
          PACKAGE_INTEGRITY: ${{ steps.package.outputs.integrity }}
        run: |
          bun scripts/verify-published-n8n-package.mjs \
            --package-spec "$PACKAGE_SPEC" \
            --integrity "$PACKAGE_INTEGRITY" \
            --n8n-version "$N8N_SMOKE_VERSION"

  publish-release:
    name: Publish complete deployed release
    runs-on: ubuntu-latest
    needs:
      [
        prepare-draft,
        build-binaries,
        build-cli,
        build-android,
        promote-image,
        deploy-production,
        publish-n8n,
      ]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Verify the exact asset set and publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md
          release_id="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json databaseId --jq '.databaseId')"
          [[ "$release_id" =~ ^[0-9]+$ ]]
          fetch_release() {
            curl --fail --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --output release.json \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}"
          }
          fetch_release
          bun scripts/release-assets.mjs verify \
            --release-json release.json \
            --tag "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --complete
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest \
            --verify-tag
          fetch_release
          bun scripts/release-assets.mjs verify \
            --release-json release.json \
            --tag "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --complete --published

  announce-discord:
    name: Announce release in Discord
    runs-on: ubuntu-latest
    needs: publish-release
    permissions:
      contents: read
    steps:
      - name: Post the release announcement
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
            echo "::notice::DISCORD_RELEASE_WEBHOOK_URL is not configured; skipping the Discord announcement."
            exit 0
          fi

          gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json body,publishedAt,tagName,url \
            > release.json

          jq -n \
            --arg tag "$(jq -r '.tagName' release.json)" \
            --arg url "$(jq -r '.url' release.json)" \
            --arg body "$(jq -r '.body // ""' release.json)" \
            --arg published_at "$(jq -r '.publishedAt' release.json)" \
            --arg repository "$GITHUB_REPOSITORY" \
            '
              ($body | if length == 0 then
                "See what changed and download the release assets."
              elif length > 3500 then
                .[0:3400] + "\n\n…"
              else
                .
              end) as $summary
              | {
                  username: "OpenPost Releases",
                  avatar_url: "https://avatars.githubusercontent.com/u/316708436?v=4",
                  allowed_mentions: { parse: [] },
                  embeds: [
                    {
                      title: ("🚀 OpenPost " + $tag + " is live"),
                      url: $url,
                      description: ($summary + "\n\n**[Read the full release notes](" + $url + ")**"),
                      color: 12012549,
                      thumbnail: {
                        url: "https://avatars.githubusercontent.com/u/316708436?v=4"
                      },
                      fields: [
                        {
                          name: "Version",
                          value: ("`" + $tag + "`"),
                          inline: true
                        },
                        {
                          name: "Use OpenPost",
                          value: "[Open the app](https://app.openpo.st) · [Self-host](https://docs.openpo.st/guide/quickstart)",
                          inline: true
                        }
                      ],
                      footer: { text: $repository },
                      timestamp: $published_at
                    }
                  ]
                }
            ' > discord-payload.json

          curl --fail-with-body --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 30 \
            --header 'Content-Type: application/json' \
            --data-binary @discord-payload.json \
            "${DISCORD_WEBHOOK_URL}?wait=true" \
            > /dev/null
