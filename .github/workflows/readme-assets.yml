name: README assets

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: readme-assets
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Generate current GitHub counts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/generate-readme-badges.mjs

      - name: Check for new stars
        id: stars
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count="$(gh api repos/getopenpost/openpost --jq '.stargazers_count')"
          [[ "$count" =~ ^[0-9]+$ ]] || exit 1
          baseline=assets/star-history/.star-count
          if [ -f "$baseline" ]; then
            previous="$(cat "$baseline")"
            [[ "$previous" =~ ^[0-9]+$ ]] || exit 1
            if [ "$count" -le "$previous" ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - uses: narayann7/star-history-action@12543ab7352b91fb7c5eb0c4fbb39772baa0c168 # v1.0.6
        id: star-history
        if: steps.stars.outputs.changed == 'true'
        with:
          repos: getopenpost/openpost
          font-family: Geist
          commit: false

      - name: Apply OpenPost Dither styles
        if: steps.star-history.outputs.changed == 'true'
        run: |
          bun install --frozen-lockfile --filter openpost
          bun scripts/style-star-history.mjs

      - name: Commit refreshed assets
        env:
          STAR_COUNT: ${{ steps.stars.outputs.count }}
          STARS_CHANGED: ${{ steps.stars.outputs.changed }}
        run: |
          if [ "$STARS_CHANGED" = "true" ]; then
            echo "$STAR_COUNT" > assets/star-history/.star-count
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/badges assets/star-history README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh README assets [skip ci]"
          branch="$(git rev-parse --abbrev-ref HEAD)"
          if [ "$branch" = "HEAD" ]; then
            echo "::error::Detached HEAD; cannot push."
            exit 1
          fi
          if ! git pull --rebase origin "$branch"; then
            git rebase --abort 2>/dev/null || true
            exit 1
          fi
          git push origin "HEAD:$branch"
