<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>OpenPost launch film</title>
		<link rel="icon" href="data:," />
		<style>
			#stage {
				display: block;
				width: 1920px;
				height: 1080px;
			}
			/* Surfaces are real DOM, drawn into WebGL through HTML-in-Canvas and never shown directly. */
			.surface {
				position: absolute;
				left: 0;
				top: 0;
				overflow: hidden;
				color: var(--ink);
				font-family: 'Geist', sans-serif;
				-webkit-font-smoothing: antialiased;
				contain: strict;
			}
			.surface.sheet {
				background: var(--surface);
			}
			.type-line {
				display: flex;
				align-items: center;
				white-space: pre;
				font-weight: 600;
				letter-spacing: -0.045em;
				line-height: 1;
			}
			.type-line i {
				display: inline-block;
				flex: none;
				width: 0.055em;
				height: 1.02em;
				margin-left: 0.04em;
				border-radius: 2px;
				background: currentColor;
			}
			.chip {
				position: absolute;
				display: flex;
				align-items: center;
				gap: 16px;
				width: 500px;
				height: 112px;
				padding: 0 24px;
				border-radius: 20px;
				background: var(--surface);
				border: 1px solid var(--line);
				font-size: 28px;
				font-weight: 600;
				letter-spacing: -0.015em;
				white-space: nowrap;
				overflow: hidden;
			}
			.chip img {
				width: 56px;
				height: 56px;
				flex: none;
				border-radius: 14px;
			}
			.chip small {
				display: block;
				margin-top: 2px;
				font-size: 20px;
				font-weight: 400;
				letter-spacing: 0;
				color: var(--muted);
			}
			.chip.alert small {
				color: var(--red);
			}
			.chip .count {
				margin-left: auto;
				min-width: 40px;
				height: 40px;
				padding: 0 12px;
				display: grid;
				place-items: center;
				border-radius: 999px;
				background: var(--red);
				color: #fff;
				font-size: 21px;
				font-weight: 600;
			}

			@font-face {
				font-family: 'Geist';
				src: url('/assets/brand/fonts/Geist-Regular.ttf');
				font-weight: 400;
			}
			@font-face {
				font-family: 'Geist';
				src: url('/assets/brand/fonts/Geist-SemiBold.ttf');
				font-weight: 600;
			}
			@font-face {
				font-family: 'Manrope';
				src: url('/assets/brand/fonts/Manrope-Variable.ttf');
				font-weight: 200 800;
			}
			@font-face {
				font-family: 'Geist Mono';
				src: url('/node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2');
				font-weight: 100 900;
			}
			@font-face {
				font-family: 'Inter';
				src: url('./todoist/Inter.ttf');
				font-weight: 100 900;
			}
			@font-face {
				font-family: 'Shantell Sans';
				src: url('./todoist/ShantellSans.ttf');
				font-weight: 300 800;
			}

			/* Film palette adapted from the app's light Dither theme. */
			:root {
				--paper: #fbf8f4;
				--surface: #ffffff;
				--sunken: #f3eee8;
				--ink: #2b2621;
				--muted: #6b6159;
				--faint: #a0958c;
				--line: #e6ded6;
				--border: #cfc5bc;
				--focal: #9b4214;
				--mark: #b45309;
				--selection: #f6e3d6;
				--green: #1f6b3a;
				--green-soft: #eef5ee;
				--peach: #f6e8e1;
				--peach-line: #e0c5b8;
				--red: #b4231d;
				--amber: #a8650a;
			}

			* {
				box-sizing: border-box;
			}

			html,
			body {
				margin: 0;
				background: #000;
			}

			.icon {
				width: 1em;
				height: 1em;
				flex: none;
			}

			.row {
				display: flex;
				align-items: center;
			}

			.accent {
				color: var(--mark);
			}

			/* Surfaces in the app's light scheme. */
			.card {
				background: var(--surface);
				border: 1px solid var(--line);
				border-radius: 20px;
				box-shadow:
					0 1px 2px rgb(43 38 33 / 6%),
					0 24px 60px rgb(43 38 33 / 12%);
			}
			.pill {
				display: inline-flex;
				align-items: center;
				gap: 10px;
				height: 56px;
				padding: 0 20px 0 10px;
				border-radius: 999px;
				background: var(--surface);
				border: 1px solid var(--line);
				font-size: 23px;
				font-weight: 600;
				white-space: nowrap;
				box-shadow: 0 10px 30px rgb(43 38 33 / 10%);
			}
			.task {
				display: inline-flex;
				align-items: center;
				gap: 14px;
				height: 62px;
				padding: 0 24px 0 18px;
				border-radius: 16px;
				background: var(--surface);
				border: 1px solid var(--line);
				font-size: 24px;
				font-weight: 600;
				white-space: nowrap;
				box-shadow: 0 14px 34px rgb(43 38 33 / 11%);
			}
			.task i {
				width: 22px;
				height: 22px;
				border-radius: 6px;
				border: 2px solid var(--border);
			}
			.tile {
				width: 92px;
				height: 92px;
				flex: none;
				border-radius: 24px;
				background: var(--surface);
				border: 1px solid var(--line);
				display: grid;
				place-items: center;
				box-shadow: 0 16px 40px rgb(43 38 33 / 12%);
			}
			.tile img {
				width: 60px;
				height: 60px;
			}
			.avatar {
				position: relative;
				width: 40px;
				height: 40px;
				flex: none;
			}
			.avatar img:first-child {
				width: 40px;
				height: 40px;
				border-radius: 50%;
			}
			.avatar img:last-child {
				position: absolute;
				right: -5px;
				bottom: -5px;
				width: 20px;
				height: 20px;
				border-radius: 6px;
				box-shadow: 0 0 0 2px var(--surface);
			}
			.button {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				gap: 10px;
				height: 52px;
				padding: 0 24px;
				border-radius: 12px;
				font-size: 22px;
				font-weight: 600;
				white-space: nowrap;
				background-size: 8px 100%;
			}
			.button.focal {
				color: #fffaf6;
				background-color: var(--focal);
				background-image: var(--dither-light);
			}
			.button.ink {
				color: var(--paper);
				background-color: var(--ink);
				background-image: var(--dither-light);
			}
			.button.ordinary {
				color: var(--ink);
				background-color: var(--surface);
				border: 1px solid var(--border);
				background-image: var(--dither-dark);
			}
			.muted {
				color: var(--muted);
			}
			.counter {
				display: inline-flex;
				align-items: center;
				gap: 8px;
				color: var(--muted);
				font-size: 20px;
				font-variant-numeric: tabular-nums;
			}
			.badge {
				width: 52px;
				height: 52px;
				border-radius: 14px;
				overflow: hidden;
				box-shadow: 0 10px 24px rgb(43 38 33 / 18%);
			}
			.badge img {
				width: 52px;
				height: 52px;
			}
			.chip-note {
				display: inline-flex;
				align-items: center;
				gap: 8px;
				height: 44px;
				padding: 0 16px;
				border-radius: 999px;
				font-size: 19px;
				font-weight: 600;
				white-space: nowrap;
				background: var(--surface);
				border: 1px solid var(--line);
				box-shadow: 0 10px 28px rgb(43 38 33 / 14%);
			}

			/* The launch image, in Todoist's own language (a sample, not affiliated). */
			.art {
				position: absolute;
				left: 0;
				top: 0;
				width: 1200px;
				height: 628px;
				transform-origin: 0 0;
				overflow: hidden;
				color: #25221e;
				background: #fffdfc;
				font-family: 'Inter', sans-serif;
			}
			.art .waves {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
			}
			.art .logo {
				position: absolute;
				left: 62px;
				top: 50px;
				width: 200px;
				height: 50px;
			}
			.art .headline {
				position: absolute;
				left: 58px;
				top: 142px;
				font-weight: 800;
				font-size: 100px;
				line-height: 1.07;
				letter-spacing: -0.045em;
				white-space: nowrap;
			}
			.art .hot {
				color: #e44332;
			}
			/* The image editor's recolour sweeps through the line; --sweep is unset everywhere else. */
			.art .hot {
				background: linear-gradient(90deg, #e44332 var(--sweep, 100%), #25221e 0);
				-webkit-background-clip: text;
				background-clip: text;
				-webkit-text-fill-color: transparent;
			}
			.art .tag {
				position: absolute;
				left: 62px;
				top: 372px;
				font-size: 31px;
				font-weight: 500;
				letter-spacing: -0.012em;
				color: #5c5650;
			}
			.art .note {
				position: absolute;
				left: 640px;
				top: 92px;
				font-family: 'Shantell Sans', cursive;
				font-size: 36px;
				font-weight: 500;
				color: #e44332;
				transform: rotate(-6deg);
			}
			.art .phone {
				position: absolute;
				left: 586px;
				top: 34px;
				width: 660px;
			}
			.art .quick {
				position: absolute;
				left: 52px;
				top: 452px;
				width: 560px;
				height: 120px;
				border-radius: 29px;
				overflow: hidden;
				box-shadow: 0 18px 44px rgb(120 60 30 / 24%);
			}
			.art .quick img {
				position: absolute;
				left: -35px;
				top: -220px;
				width: 629px;
			}
			.promise-line {
				position: absolute;
				left: 0;
				top: 62px;
				white-space: pre;
				font-size: 136px;
				font-weight: 600;
				letter-spacing: -0.04em;
				line-height: 148px;
			}
			.promise-line.word-mode {
				top: 90px;
				line-height: 240px;
			}
			.promise-b {
				color: var(--mark);
			}
			.promise-word {
				font-family: 'Manrope', sans-serif;
				font-size: 196px;
				letter-spacing: -0.035em;
			}
			.promise-line i {
				display: inline-block;
				width: 0.045em;
				height: 0.92em;
				margin-left: 0.04em;
				vertical-align: -0.14em;
				border-radius: 3px;
				background: var(--mark);
			}
			.promise-line.word-mode i {
				font-size: 196px;
			}
			.build-progress {
				margin-top: 16px;
				height: 7px;
				border-radius: 4px;
				background: var(--sunken);
				overflow: hidden;
			}
			.build-progress i {
				display: block;
				height: 100%;
				width: 0;
				border-radius: 4px;
				background: linear-gradient(90deg, #c9631f, #e9a066);
			}
			.build-status {
				margin-left: auto;
				padding: 6px 16px;
				border-radius: 999px;
				font-size: 21px;
				font-weight: 600;
				letter-spacing: 0;
				background: var(--selection);
				color: var(--focal);
			}
			.build-row {
				display: flex;
				align-items: center;
				gap: 16px;
				height: 78px;
				padding: 0 14px;
				border-radius: 16px;
				font-size: 29px;
				white-space: nowrap;
			}
			.build-work {
				margin-left: auto;
				display: flex;
				align-items: center;
				gap: 8px;
			}
			.build-work img {
				border-radius: 10px;
			}
			.build-pill {
				padding: 5px 12px;
				border-radius: 999px;
				background: #fff;
				border: 1px solid var(--line);
				color: var(--focal);
				font-size: 18px;
				font-weight: 600;
			}
			.build-stream {
				font-size: 23px;
				color: var(--muted);
			}
			.tick {
				flex: none;
				overflow: visible;
			}
			.tick .ring {
				fill: none;
				stroke-width: 4;
				stroke-linecap: round;
				transform-origin: 20px 20px;
			}
			.tick .disc {
				fill: #2f8f57;
				transform-origin: 20px 20px;
			}
			.tick .stroke {
				fill: none;
				stroke: #fff;
				stroke-width: 4.5;
				stroke-linecap: round;
				stroke-linejoin: round;
				stroke-dasharray: 1;
			}
			.post-count {
				display: inline-flex;
				align-items: center;
				gap: 12px;
				height: 62px;
				padding: 0 20px 0 14px;
				border-radius: 999px;
				border: 2px solid;
				font-size: 30px;
				font-weight: 600;
				font-variant-numeric: tabular-nums;
			}
			.post-word {
				position: absolute;
				left: 0;
				top: 0;
				font-size: 44px;
				line-height: 57px;
				letter-spacing: -0.012em;
				white-space: nowrap;
				transform-origin: 0 0;
			}
			.post-word.over {
				background: #fbdcd8;
				box-shadow:
					-6px 0 0 #fbdcd8,
					6px 0 0 #fbdcd8;
			}
			.post-perfected {
				display: inline-flex;
				align-items: center;
				gap: 12px;
				height: 56px;
				padding: 0 24px;
				border-radius: 28px;
				color: #fffaf6;
				font-size: 28px;
				font-weight: 600;
				letter-spacing: -0.015em;
				transform-origin: 0 50%;
			}
			.url-line {
				display: flex;
				align-items: center;
				justify-content: center;
				height: 80px;
				font-family: 'Geist Mono', monospace;
				font-size: 46px;
				font-weight: 500;
				letter-spacing: -0.02em;
				line-height: 80px;
				white-space: pre;
			}
			.url-slot {
				display: inline-block;
				width: 1ch;
			}
			.team-line {
				height: 200px;
				display: flex;
				align-items: center;
				justify-content: center;
				white-space: pre;
				font-size: 104px;
				font-weight: 400;
				letter-spacing: -0.03em;
				color: #e9fbff;
				text-shadow: 0 2px 30px rgb(3 30 40 / 60%);
			}

			.selection {
				position: absolute;
				border: 2px solid #3d8bfd;
			}
			.selection i {
				position: absolute;
				width: 14px;
				height: 14px;
				background: #fff;
				border: 2px solid #3d8bfd;
				border-radius: 3px;
			}

			.layer-row {
				display: flex;
				align-items: center;
				gap: 14px;
				height: 56px;
				padding: 0 16px;
				border-radius: 12px;
				font-size: 21px;
			}
			.swatch {
				width: 40px;
				height: 40px;
				border-radius: 10px;
				border: 2px solid var(--line);
			}
			.track {
				position: absolute;
				height: 62px;
				border-radius: 12px;
				background: var(--sunken);
				border: 1px solid var(--line);
				overflow: hidden;
			}
			.clip {
				position: absolute;
				top: 6px;
				height: 50px;
				border-radius: 9px;
				overflow: hidden;
				font-size: 17px;
				font-weight: 600;
				display: flex;
				align-items: center;
				gap: 8px;
				padding: 0 12px;
				white-space: nowrap;
			}
			.caption-word {
				display: inline-block;
				padding: 4px 12px;
				margin: 0 3px;
				border-radius: 8px;
				background: rgb(0 0 0 / 70%);
				color: #fff;
				font-size: 30px;
				font-weight: 600;
			}

			.status {
				display: inline-flex;
				align-items: center;
				gap: 7px;
				font-weight: 600;
			}
			.status i {
				width: 10px;
				height: 10px;
				border-radius: 50%;
				background: currentColor;
			}
			.cal-chip {
				border-radius: 9px;
				padding: 8px 10px;
				font-size: 16px;
				line-height: 1.3;
				font-weight: 600;
				overflow: hidden;
			}
			.cal-chip .meta {
				display: flex;
				justify-content: space-between;
				align-items: center;
				font-weight: 400;
				margin-top: 4px;
			}

			.stat {
				padding: 26px 30px;
			}
			.stat .k {
				font-size: 21px;
				color: var(--muted);
				display: flex;
				align-items: center;
				gap: 10px;
			}
			.stat .v {
				margin-top: 8px;
				font-size: 58px;
				font-weight: 600;
				letter-spacing: -0.03em;
				font-variant-numeric: tabular-nums;
			}
			.message {
				display: flex;
				gap: 18px;
				padding: 20px 26px;
				align-items: center;
			}
			.message img.mark {
				width: 56px;
				height: 56px;
				border-radius: 14px;
			}
			.message .who {
				font-size: 22px;
				color: var(--muted);
			}
			.message .who b {
				color: var(--ink);
				font-weight: 600;
				margin-right: 8px;
			}
			.message .text {
				font-size: 32px;
				margin-top: 4px;
			}

			.feature {
				display: inline-flex;
				align-items: center;
				gap: 14px;
				height: 96px;
				padding: 0 38px 0 30px;
				border-radius: 999px;
				background: var(--surface);
				border: 1px solid var(--line);
				font-size: 36px;
				font-weight: 600;
				white-space: nowrap;
				box-shadow: 0 12px 30px rgb(43 38 33 / 9%);
			}
			.feature .icon {
				font-size: 40px;
				color: var(--mark);
			}

			.mark path {
				fill: var(--mark);
			}
			.wordmark {
				font-family: 'Manrope', sans-serif;
				font-weight: 600;
				font-size: 148px;
				letter-spacing: -0.035em;
				line-height: 1;
				white-space: nowrap;
			}
			.wordmark span {
				display: inline-block;
			}
			.closing {
				left: 0;
				width: 1920px;
				text-align: center;
				white-space: nowrap;
			}
			.cursor {
				width: 64px;
				height: 64px;
				filter: drop-shadow(0 8px 14px rgb(0 0 0 / 28%));
				transform-origin: 8px 6px;
			}
			.label {
				position: absolute;
				right: 44px;
				bottom: 32px;
				font-size: 17px;
				color: rgb(43 38 33 / 42%);
			}
			/* Rebuilt app scenes. Every visible UI element belongs to the animation. */
			.flow-viewport {
				overflow: hidden;
				background-color: var(--paper);
				background-image: radial-gradient(var(--border) 1px, transparent 1px);
				background-size: 28px 28px;
				border-top: 1px solid var(--line);
			}
			.flow-node {
				padding: 22px 24px 14px;
				border: 2px solid var(--border);
				border-radius: 20px;
				background: var(--surface);
				box-shadow: 0 4px 8px rgb(43 38 33 / 6%);
			}
			.flow-node.active {
				border-color: var(--mark);
			}
			.flow-node b {
				font-size: 27px;
				font-weight: 600;
				white-space: nowrap;
			}
			.flow-node p {
				margin: 6px 0 0;
				color: var(--muted);
				font-size: 18px;
				white-space: nowrap;
			}
			.flow-icon {
				width: 62px;
				height: 62px;
				display: flex;
				align-items: center;
				justify-content: center;
				border: 1px solid #c8b6e6;
				border-radius: 14px;
				background: #eee5f6;
				flex: none;
			}
			.flow-node.trigger .flow-icon {
				background: #f6ded0;
				border-color: #e6ad90;
			}
			.flow-node.content .flow-icon {
				background: #dbeddc;
				border-color: #9fc5a4;
			}
			.flow-node.ai .flow-icon {
				background: #e2eaf7;
				border-color: #a2bde0;
			}
			.flow-state {
				display: flex;
				gap: 7px;
				align-items: center;
				margin: 13px 0 0 82px;
				font-size: 16px;
				color: var(--muted);
			}
			.flow-port {
				position: absolute;
				top: 62px;
				width: 16px;
				height: 16px;
				border: 3px solid var(--surface);
				border-radius: 50%;
				background: var(--muted);
			}
			.flow-port.input {
