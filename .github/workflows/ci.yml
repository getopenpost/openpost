name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.11"

jobs:
  plan:
    name: Plan affected surfaces
    runs-on: ubuntu-latest
    outputs:
      application: ${{ steps.plan.outputs.application }}
      backend: ${{ steps.plan.outputs.backend }}
      frontend: ${{ steps.plan.outputs.frontend }}
      marketing: ${{ steps.plan.outputs.marketing }}
      documentation: ${{ steps.plan.outputs.documentation }}
      cli: ${{ steps.plan.outputs.cli }}
      security: ${{ steps.plan.outputs.security }}
      image: ${{ steps.plan.outputs.image }}
      android: ${{ steps.plan.outputs.android }}
      cache_contract: ${{ steps.plan.outputs.cache_contract }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Plan from the fail-closed release surface registry
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            bun scripts/ci-plan.mjs --base "$BASE_SHA" --head "$GITHUB_SHA"
          else
            bun scripts/ci-plan.mjs --full --base "$BEFORE_SHA" --head "$GITHUB_SHA"
          fi

  policy:
    name: Contracts and policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            cli/go.sum
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bash scripts/ci-timing-summary.sh start policy
      - run: bun install --frozen-lockfile
      - name: Check generated contracts and repository policy
        run: |
          bun run check:build-graph
          bun run check:assets
          bun run check:public-routes
          bun run check:mcp-registry
          bun run check:docs
          bun run check:release-version
          bun run check:app-routes
          bun run check:legal-policy
          bun run check:provider-certification
          bun run check:provider-facts
          bun run check:changelog
          bun run check:social-images
          bun run check:image-policy
          bun run check:reachability
          bun run check:ui-consistency
          bun run check:contracts
      - if: always()
        run: bash scripts/ci-timing-summary.sh finish policy

  backend-lint:
    name: Backend and CLI lint
    needs: plan
    if: needs.plan.outputs.backend == 'true' || needs.plan.outputs.cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            cli/go.sum
      - run: bash scripts/ci-timing-summary.sh start backend-lint
      - name: Check Go formatting
        run: |
          unformatted=$(find backend cli -path '*/.devenv' -prune -o -type f -name '*.go' -exec gofmt -l {} +)
          test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        if: needs.plan.outputs.backend == 'true'
        with:
          version: v2.11.4
          working-directory: backend
          args: --build-tags dev ./...
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        if: needs.plan.outputs.cli == 'true'
        with:
          version: v2.11.4
          working-directory: cli
          args: ./...
      - if: always()
        run: bash scripts/ci-timing-summary.sh finish backend-lint

  frontend-quality:
    name: Svelte lint and checks
    needs: plan
    if: needs.plan.outputs.frontend == 'true' || needs.plan.outputs.marketing == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bash scripts/ci-timing-summary.sh start frontend-quality
      - run: bun install --frozen-lockfile
      - if: needs.plan.outputs.frontend == 'true'
        run: |
          bun run --filter @openpost/web lint
          bun run --filter @openpost/web check
      - if: needs.plan.outputs.marketing == 'true'
        run: bun run --filter @openpost/site check
      - if: always()
        run: bash scripts/ci-timing-summary.sh finish frontend-quality

  backend:
    name: Backend tests
    needs: plan
    if: needs.plan.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - working-directory: backend
        run: go test -tags dev -coverprofile=coverage.out ./...
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: backend/coverage.out
          fail_ci_if_error: false

  backend-race:
    name: Backend race tests
    needs: plan
    if: needs.plan.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - working-directory: backend
        run: go test -tags dev -race ./...

  frontend-build:
    name: Frontend tests and canonical build
    needs: plan
    if: needs.plan.outputs.application == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-frontend-${{ runner.os }}-${{ hashFiles('bun.lock', 'turbo.json', 'frontend/turbo.json') }}-${{ github.sha }}
          restore-keys: turbo-frontend-${{ runner.os }}-${{ hashFiles('bun.lock', 'turbo.json', 'frontend/turbo.json') }}-
      - run: bash scripts/ci-timing-summary.sh start frontend-build
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - if: needs.plan.outputs.frontend == 'true'
        run: bun run --filter @openpost/web test
      - if: needs.plan.outputs.frontend == 'true'
        run: bun run --filter @openpost/video-project test
      - name: Build the canonical application artifact and source maps
        env:
          POSTHOG_SOURCEMAPS_ENABLED: ${{ github.event_name == 'push' && secrets.POSTHOG_PERSONAL_API_KEY != '' && vars.POSTHOG_PROJECT_ID != '' && '1' || '0' }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          POSTHOG_UI_HOST: ${{ vars.POSTHOG_UI_HOST }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            bunx turbo run build --filter @openpost/web --force
            bun run package:frontend
          else
            bun run frontend:build
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-public-${{ github.sha }}-${{ github.run_attempt }}
          path: backend/cmd/openpost/public
          if-no-files-found: error
          retention-days: 14
      - if: always()
        run: bash scripts/ci-timing-summary.sh finish frontend-build

  marketing-build:
    name: Marketing build
    needs: plan
    if: needs.plan.outputs.marketing == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-marketing-${{ runner.os }}-${{ hashFiles('bun.lock', 'turbo.json', 'marketing-site/turbo.json') }}-${{ github.sha }}
          restore-keys: turbo-marketing-${{ runner.os }}-${{ hashFiles('bun.lock', 'turbo.json', 'marketing-site/turbo.json') }}-
      - run: bun install --frozen-lockfile
      - name: Build canonical marketing artifact and source maps
        env:
          VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
          VITE_POSTHOG_API_HOST: ${{ vars.POSTHOG_BROWSER_HOST }}
          VITE_POSTHOG_UI_HOST: ${{ vars.POSTHOG_UI_HOST }}
          VITE_OPENPOST_ENVIRONMENT: production
          VITE_OPENPOST_REVISION: ${{ github.sha }}
          POSTHOG_SOURCEMAPS_ENABLED: ${{ github.event_name == 'push' && secrets.POSTHOG_PERSONAL_API_KEY != '' && vars.POSTHOG_PROJECT_ID != '' && '1' || '0' }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          POSTHOG_UI_HOST: ${{ vars.POSTHOG_UI_HOST }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            bunx turbo run build --filter @openpost/site --force
          else
            bun run marketing:build
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: marketing-static-${{ github.sha }}-${{ github.run_attempt }}
          path: marketing-site/dist
          if-no-files-found: error
          retention-days: 14

  docs-build:
    name: Documentation build
    needs: plan
    if: needs.plan.outputs.documentation == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-docs-${{ runner.os }}-${{ hashFiles('bun.lock', 'turbo.json', 'docs-site/turbo.json') }}-${{ github.sha }}
          restore-keys: turbo-docs-${{ runner.os }}-${{ hashFiles('bun.lock', 'turbo.json', 'docs-site/turbo.json') }}-
      - run: bun install --frozen-lockfile
      - name: Build canonical documentation artifact and source maps
        env:
          VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
          VITE_POSTHOG_API_HOST: ${{ vars.POSTHOG_BROWSER_HOST }}
          VITE_POSTHOG_UI_HOST: ${{ vars.POSTHOG_UI_HOST }}
          VITE_OPENPOST_ENVIRONMENT: production
          VITE_OPENPOST_REVISION: ${{ github.sha }}
          POSTHOG_SOURCEMAPS_ENABLED: ${{ github.event_name == 'push' && secrets.POSTHOG_PERSONAL_API_KEY != '' && vars.POSTHOG_PROJECT_ID != '' && '1' || '0' }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          POSTHOG_UI_HOST: ${{ vars.POSTHOG_UI_HOST }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          bun run prepare:docs
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            bunx turbo run build --filter @openpost/docs --force
          else
            bunx turbo run build --filter @openpost/docs
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-static-${{ github.sha }}-${{ github.run_attempt }}
          path: docs-site/.vitepress/dist
          if-no-files-found: error
          retention-days: 14

  browser-app:
    name: Application browser suite
    needs: [plan, frontend-build]
    if: needs.plan.outputs.application == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-public-${{ github.sha }}-${{ github.run_attempt }}
          path: backend/cmd/openpost/public
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Test the canonical application artifact
        env:
          OPENPOST_E2E_PREBUILT: "1"
        run: bun run test:e2e:app

  browser-marketing:
    name: Marketing browser suite
    needs: [plan, marketing-build]
    if: needs.plan.outputs.marketing == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: marketing-static-${{ github.sha }}-${{ github.run_attempt }}
          path: marketing-site/dist
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - env:
          OPENPOST_E2E_PREBUILT: "1"
        run: bun run test:e2e

  browser-docs:
    name: Documentation browser suite
    needs: [plan, docs-build]
    if: needs.plan.outputs.documentation == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docs-static-${{ github.sha }}-${{ github.run_attempt }}
          path: docs-site/.vitepress/dist
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - env:
          OPENPOST_E2E_PREBUILT: "1"
        run: bun run test:e2e:docs

  cache-contract:
    name: Frontend cache contract
    needs: plan
    if: needs.plan.outputs.cache_contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run verify:frontend-build-cache

  security:
    name: Security
    needs: plan
    if: needs.plan.outputs.security == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            cli/go.sum
      - run: bun install --frozen-lockfile
      - run: scripts/security-check.sh

  cli:
    name: CLI
    needs: plan
    if: needs.plan.outputs.cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - working-directory: cli
        run: |
          go build ./...
          go test ./...

  android:
    name: Unsigned Android candidate
    needs: plan
    if: github.event_name == 'push' && needs.plan.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: "21"
          distribution: temurin
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.bun/install/cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-${{ runner.os }}-${{ hashFiles('bun.lock', 'frontend/android/**/*.gradle*', 'frontend/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: android-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run --filter @openpost/web build:capacitor
      - working-directory: frontend/android
        run: ./gradlew assembleRelease
      - run: |
          cp frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk openpost-app-android-unsigned.apk
          sha256sum openpost-app-android-unsigned.apk > openpost-app-android-unsigned.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-unsigned-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            openpost-app-android-unsigned.apk
            openpost-app-android-unsigned.sha256
          if-no-files-found: error
          retention-days: 14

  image:
    name: Production image
    needs: [plan, frontend-build]
    if: needs.plan.outputs.image == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-public-${{ github.sha }}-${{ github.run_attempt }}
          path: backend/cmd/openpost/public
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive the exact candidate release manifest
        id: manifest
        shell: bash
        run: |
          latest_tag="$(git for-each-ref --count=1 --sort=-version:refname --format='%(refname:short)' 'refs/tags/v*')"
          [[ -n "$latest_tag" ]]
          bun run check:provider-certification
          bun scripts/release-manifest.mjs create --changelog CHANGELOG.md --latest-tag "$latest_tag" --revision "$GITHUB_SHA" --output release-manifest.json
          version="$(jq -er .version release-manifest.json)"
          revision="$(jq -er .revision release-manifest.json)"
          [[ "$revision" == "$GITHUB_SHA" ]]
          manifest_sha256="$(openssl dgst -sha256 -r release-manifest.json | awk '{print $1}')"
          { echo "version=$version"; echo "sha256=$manifest_sha256"; echo "base64=$(base64 -w0 release-manifest.json)"; } >> "$GITHUB_OUTPUT"
      - name: Build the candidate once
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}"
          platform="$(jq -er '.supported_platforms | if length == 1 then .[0] else error("candidate build requires exactly one supported platform") end' docker/image-policy.json)"
          docker buildx build --load --platform "$platform" --build-context frontend_artifact=backend/cmd/openpost/public --file docker/Dockerfile --tag "$image" --build-arg VERSION="${{ steps.manifest.outputs.version }}" --build-arg COMMIT="$GITHUB_SHA" --build-arg RELEASE_MANIFEST_B64="${{ steps.manifest.outputs.base64 }}" --build-arg RELEASE_MANIFEST_SHA256="${{ steps.manifest.outputs.sha256 }}" --cache-from type=gha,scope=openpost-production --cache-to type=gha,mode=max,scope=openpost-production .
          scripts/smoke-production-image.sh "$image" "$GITHUB_SHA" "${{ steps.manifest.outputs.version }}" release-manifest.json
      - name: Generate the final-image SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          scan-type: image
          scanners: vuln
          format: spdx-json
          output: openpost-image.spdx.json
          version: v0.70.0
      - name: Record the full final-image vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          scan-type: image
          scanners: vuln
          format: json
          output: openpost-image-trivy.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 0
          version: v0.70.0
      - name: Validate image assurance evidence
        run: |
          jq -e '(.spdxVersion | startswith("SPDX-")) and (.packages | type == "array") and (.packages | length > 0)' openpost-image.spdx.json >/dev/null
          jq -e '(.SchemaVersion // 0) >= 2 and (.Results | type == "array") and (.Results | length > 0)' openpost-image-trivy.json >/dev/null
      - name: Retain final-image diagnostic evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            release-manifest.json
            openpost-image.spdx.json
            openpost-image-trivy.json
          if-no-files-found: error
          retention-days: 14
      - name: Block fixable high-severity vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          scan-type: image
          scanners: vuln
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
          version: v0.70.0
      - name: Publish the validated candidate and record its digest
        if: github.event_name == 'push'
        id: publish
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}"
          docker push "$image"
          repository="${image%:sha-*}"
          digest_ref="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$image" | awk -v prefix="${repository}@" 'index($0, prefix) == 1 { print; exit }')"
          digest="${digest_ref#*@}"
          [[ "$digest" == sha256:* ]] || { echo "Published candidate did not resolve to a registry digest." >&2; exit 1; }
          bun scripts/image-evidence.mjs create --repository "$repository" --tag "sha-${GITHUB_SHA}" --revision "$GITHUB_SHA" --digest "$digest" --release-manifest release-manifest.json --sbom openpost-image.spdx.json --vulnerability-report openpost-image-trivy.json --output openpost-image-evidence.json
      - name: Upload exact candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push'
        with:
          name: release-manifest-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            release-manifest.json
            openpost-image-evidence.json
            openpost-image.spdx.json
            openpost-image-trivy.json
          if-no-files-found: error
          retention-days: 14

  release-candidate:
    name: Release Candidate
    if: always()
    needs:
      [
        plan,
        policy,
        backend-lint,
        frontend-quality,
        backend,
        backend-race,
        frontend-build,
        marketing-build,
        docs-build,
        browser-app,
        browser-marketing,
        browser-docs,
        cache-contract,
        security,
        cli,
        android,
        image,
      ]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Write matrix timing summary
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          {
            echo "## CI job timings"
            echo
            echo "| Job | Result | Wall time |"
            echo "| --- | --- | ---: |"
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
              --jq '.jobs[] | select(.completed_at != null) | [.name, .conclusion, .started_at, .completed_at] | @tsv' |
              while IFS=$'\t' read -r name conclusion started completed; do
                started_epoch="$(date --date="$started" +%s)"
                completed_epoch="$(date --date="$completed" +%s)"
                elapsed="$(( completed_epoch - started_epoch ))"
                printf '| %s | %s | %dm %02ds |\n' "$name" "$conclusion" "$(( elapsed / 60 ))" "$(( elapsed % 60 ))"
              done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Require every planned check
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          printf 'Job results: %s\n' "$RESULTS"
          [[ "$RESULTS" != *failure* && "$RESULTS" != *cancelled* ]]
