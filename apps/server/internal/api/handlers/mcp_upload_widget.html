<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Upload media to OpenPost</title>
    <style>
      /*MCP_UI_STYLES*/
      body {
        padding: 16px;
      }
      .panel {
        display: grid;
        gap: 14px;
        padding: 16px;
        max-width: 36rem;
        margin-inline: auto;
      }
      h1 {
        font-size: 18px;
        margin: 0;
      }
      p {
        margin: 0;
        color: var(--muted-foreground);
        line-height: 1.45;
      }
      .field {
        display: grid;
        gap: 6px;
      }
      label {
        font-size: 13px;
        font-weight: 650;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        font: inherit;
        min-height: 44px;
        border: 1px solid var(--input);
        border-radius: var(--theme-radius-md);
        padding: 8px 12px;
        background: var(--background);
        color: var(--foreground);
      }
      input:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 3px;
      }
      .status {
        min-height: 22px;
        font-size: 13px;
        overflow-wrap: anywhere;
      }
      .error {
        color: var(--destructive);
      }
      .success {
        color: var(--success-foreground);
      }
      ::selection {
        background: var(--selection);
        color: var(--selection-foreground);
      }
    </style>
  </head>
  <body data-theme-button="dither">
    <main class="panel">
      <div>
        <h1>Add local media</h1>
        <p>Add an image or video to your media library.</p>
      </div>
      <div class="field">
        <label for="file">Media file</label><input id="file" type="file" accept="image/*,video/*" />
      </div>
      <div class="field">
        <label for="alt">Alt text <span aria-hidden="true">(optional)</span></label
        ><input id="alt" type="text" maxlength="2000" />
      </div>
      <button id="upload" type="button" data-static-action data-dither-button="always">
        Upload to OpenPost
      </button>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </main>
    <script>
      (function () {
        /*MCP_UPLOAD_TOOL_NAMES*/ var file = document.getElementById("file"),
          alt = document.getElementById("alt"),
          button = document.getElementById("upload"),
          status = document.getElementById("status");
        function input() {
          return (window.openai && window.openai.toolInput) || {};
        }
        function show(text, kind) {
          status.textContent = text;
          status.className = "status " + (kind || "");
        }
        // Gateways in front of MCP servers (Cloudflare MCP Server Portals, mcphub,
        // admin aliases) rewrite tool names, commonly to {server_id}_{tool_name}.
        // A bare ticket tool call then fails as tool-not-found even though this
        // widget rendered fine. The MCP Apps ui/initialize handshake answers with
        // hostContext.toolInfo.tool.name, the host-exposed name of the tool that
        // rendered this widget, so recover the prefix from it and reapply it to the
        // ticket tool. Without host metadata the bare name is used, which is what
        // direct connections expect.
        var ticketToolPromise = null;
        function resolveTicketTool() {
          if (ticketToolPromise) return ticketToolPromise;
          ticketToolPromise = new Promise(function (resolve) {
            var request = {
              jsonrpc: "2.0",
              id: "openpost-upload-init",
              method: "ui/initialize",
              params: {
                appInfo: { name: "openpost-local-upload", version: "1.0.0" },
                appCapabilities: {},
                protocolVersion: "2026-01-26",
              },
            };
            var timer = null;
            function finish(name) {
              if (timer !== null) window.clearTimeout(timer);
              window.removeEventListener("message", onHostMessage);
              resolve(name);
            }
            function onHostMessage(event) {
              if (event.source !== window.parent) return;
              var data = event.data;
              if (!data || data.jsonrpc !== "2.0" || data.id !== request.id) return;
              window.parent.postMessage(
                { jsonrpc: "2.0", method: "ui/notifications/initialized", params: {} },
                "*",
              );
              var invoked =
                data.result &&
                data.result.hostContext &&
                data.result.hostContext.toolInfo &&
                data.result.hostContext.toolInfo.tool &&
                data.result.hostContext.toolInfo.tool.name;
              if (typeof invoked === "string" && invoked.slice(-renderTool.length) === renderTool) {
                finish(invoked.slice(0, invoked.length - renderTool.length) + ticketToolDefault);
              } else {
                finish(ticketToolDefault);
              }
            }
            timer = window.setTimeout(function () {
              finish(ticketToolDefault);
            }, 3000);
            window.addEventListener("message", onHostMessage);
            window.parent.postMessage(request, "*");
          });
          return ticketToolPromise;
        }
        function isToolNotFound(error) {
          var text = error && error.message ? String(error.message) : "";
          return (
            /tool/i.test(text) &&
            /unknown|no such|not (found|exist|supported|available)/i.test(text)
          );
        }
        button.addEventListener("click", async function () {
          var selected = file.files && file.files[0],
            workspace = input().workspace_id;
          if (!selected) {
            show("Choose a file first.", "error");
            file.focus();
            return;
          }
          if (!workspace) {
            show("The upload is missing a workspace. Ask the agent to reopen it.", "error");
            return;
          }
          if (!window.openai || !window.openai.callTool) {
            show("This MCP client does not support app tool calls.", "error");
            return;
          }
          button.disabled = true;
          show("Preparing secure upload…");
          try {
            var ticketTool = await resolveTicketTool();
            var ticket;
            try {
              ticket = await window.openai.callTool(ticketTool, {
                workspace_id: workspace,
                filename: selected.name,
                mime_type: selected.type || "application/octet-stream",
                size: selected.size,
                alt_text: alt.value.trim(),
              });
            } catch (error) {
              if (isToolNotFound(error)) {
                throw new Error(
                  "This MCP client does not expose the OpenPost upload tool (" +
                    ticketTool +
                    "). If it renames tools, connect the OpenPost MCP server directly and try again.",
                );
              }
              throw error;
            }
            var upload = ticket && ticket._meta && ticket._meta.upload;
            if (!upload) throw new Error("OpenPost did not return an upload ticket");
            show("Uploading " + selected.name + "…");
            var response = await fetch(upload.url, {
              method: upload.method || "PUT",
              headers: upload.headers || {},
              body: selected,
            });
            var result = await response.json();
            if (!response.ok) throw new Error(result.error || "Upload failed");
            show("Uploaded " + (result.original_filename || selected.name) + ".", "success");
            if (window.openai.sendFollowUpMessage) {
              await window.openai.sendFollowUpMessage({
                prompt:
                  "Use the OpenPost media item " +
                  result.id +
                  " (" +
                  (result.original_filename || selected.name) +
                  ") in this conversation.",
              });
            }
          } catch (error) {
            show(error && error.message ? error.message : "Upload failed.", "error");
          } finally {
            button.disabled = false;
          }
        });
        resolveTicketTool();
      })();
    </script>
  </body>
</html>
