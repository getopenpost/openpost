# Triggered through a merged pull request so GitHub emits the workflow event.
name: Observe v1.45.0 release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/observe-v1.45.0.yml"

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: observe-v1.45.0-release
  cancel-in-progress: false

jobs:
  report:
    name: Report release run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find the v1.45.0 release run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          run_json=""
          for _ in $(seq 1 60); do
            run_json="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow release.yml \
                --limit 30 \
                --json databaseId,headBranch,headSha,status,conclusion,url,event \
                --jq '.[] | select(.headBranch == "v1.45.0")' \
                | head -n 1
            )"
            if [[ -n "$run_json" ]]; then
              break
            fi
            sleep 5
          done

          if [[ -z "$run_json" ]]; then
            body='RELEASE_RUN_NOT_FOUND=v1.45.0'
          else
            run_id="$(jq -r .databaseId <<<"$run_json")"
            status="$(jq -r .status <<<"$run_json")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$run_json")"
            url="$(jq -r .url <<<"$run_json")"
            sha="$(jq -r .headSha <<<"$run_json")"
            body=$(printf 'RELEASE_RUN_ID=%s\nRELEASE_RUN_STATUS=%s\nRELEASE_RUN_CONCLUSION=%s\nRELEASE_RUN_SHA=%s\nRELEASE_RUN_URL=%s' "$run_id" "$status" "$conclusion" "$sha" "$url")
          fi

          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/issues/27/comments" \
            -f body="$body"

      - name: Remove observer workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/observe-v1.45.0.yml
          git commit -m "chore: remove v1.45.0 release observer"
          git push origin HEAD:main
