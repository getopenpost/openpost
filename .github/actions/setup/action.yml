name: Set up OpenPost
description: Pinned Bun, cached dependencies, and optional Go, Node, Chromium and media tools.

inputs:
  go:
    description: Install Go from apps/server/go.mod
    default: "false"
  node:
    description: Install the pinned Node.js runtime
    default: "false"
  install:
    description: Run a frozen root Bun install
    default: "true"
  chromium:
    description: "Playwright Chromium build: none, full (channel chromium) or shell (headless shell)"
    default: none
  media:
    description: Install the pinned static FFmpeg and ffprobe
    default: "false"

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json
    - if: inputs.node == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24.19.0"
    - if: inputs.go == 'true'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: apps/server/go.mod
        cache-dependency-path: |
          apps/server/go.sum
          apps/cli/go.sum
    # Scripts that fall back to a checkout-local build cache (the contracts
    # check) otherwise compile the server cold on every run.
    - if: inputs.go == 'true'
      shell: bash
      run: echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
    - if: inputs.install == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
    - if: inputs.install == 'true'
      shell: bash
      run: bun install --frozen-lockfile
    # The PostHog CLI downloads its binary from GitHub releases on first use.
    - if: inputs.install == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules/@posthog/cli/node_modules/.bin_real
        key: posthog-cli-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
        restore-keys: posthog-cli-${{ runner.os }}-${{ runner.arch }}-
    # Key browsers on the installed Playwright version, not the whole lockfile,
    # so unrelated dependency changes keep reusing the downloaded browser.
    - if: inputs.chromium != 'none'
      id: playwright
      shell: bash
      run: |
        version="$(bunx --no-install playwright --version | awk '{print $2}')"
        [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - if: inputs.chromium != 'none'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ inputs.chromium }}-${{ steps.playwright.outputs.version }}
    - if: inputs.chromium != 'none'
      shell: bash
      env:
        CHROMIUM: ${{ inputs.chromium }}
      run: timeout 300 bash scripts/ci-setup-tools.sh chromium "$CHROMIUM"
    # The script pins and verifies a static FFmpeg build; never use apt here.
    - if: inputs.media == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/openpost-ffmpeg
        key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci-setup-tools.sh') }}
    - if: inputs.media == 'true'
      shell: bash
      run: timeout 300 bash scripts/ci-setup-tools.sh media
