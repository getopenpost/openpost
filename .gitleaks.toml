title = "OpenPost secret scanning"
minVersion = "v8.30.1"

[extend]
useDefault = true

[[allowlists]]
description = "Literal private-token examples test cURL credential rejection"
targetRules = ["curl-auth-header"]
condition = "AND"
regexTarget = "line"
paths = ['''(?:^|/)apps/web/src/lib/workflows/curl\.test\.ts$''']
regexes = [
  '''^\s*command: `curl https://example\.com -H '(?:Authorization: Bearer|X-API-Key:) private-token'`,\s*$''',
]

[[allowlists]]
description = "Video EQ field-map keys are identifiers, not credentials"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''(?:^|/)(?:frontend|apps/web)/src/lib/video-editor/components/audio-eq-panel\.svelte$''']
regexes = ['''(?:frequencyKey|slopeKey):\s*'band[0-9]+(?:FrequencyHz|SlopeDbPerOct)'\s*,''']

[[allowlists]]
description = "Discord guild credential prefix and the following safe error-code constant are identifiers"
targetRules = ["discord-client-secret"]
condition = "AND"
regexTarget = "match"
paths = ['''(?:^|/)(?:backend|apps/server)/internal/platform/discord_bot\.go$''']
regexes = ['''discord-guild:"\s+discordChannelPermissionLostCode''']

[[allowlists]]
description = "Localized Discord bot label and description keys are UI copy identifiers"
targetRules = ["discord-client-secret"]
condition = "AND"
regexTarget = "match"
paths = ['''(?:^|/)(?:frontend|apps/web)/messages/[^/]+\.json$''']
regexes = ['''(?:Discord(?: bot)?|Discord-Bot)",\s+"accounts_discord_bot_description''']

[[allowlists]]
description = "Vendored css-color patch contains adjacent CSS Syntax token names, not credentials"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
paths = ['''(?:^|/)patches/@asamuzakjp%2Fcss-color@3\.2\.0\.patch$''']
regexes = ['''-token",t\.Close(?:Paren|Square)="''']
