name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release-preflight:
    name: Release Preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Set up devenv cache
        uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install devenv
        shell: bash
        run: nix profile add nixpkgs#devenv

      - name: Run backend, frontend, CLI, and docs checks
        shell: devenv shell bash -- -e {0}
        run: |
          mkdir -p backend/cmd/openpost/public
          touch backend/cmd/openpost/public/.gitkeep

          backend-format-check
          backend-lint
          cd backend
          go test -v ./...
          cd ..

          pnpm install --frozen-lockfile
          pnpm run check:docs
          pnpm run check:release-version
          pnpm run check:changelog
          pnpm run check:ui-consistency
          pnpm exec playwright install --with-deps chromium
          pnpm --filter @openpost/web lint
          pnpm --filter @openpost/web check
          pnpm --filter @openpost/web test
          pnpm --filter @openpost/web build
          pnpm --filter @openpost/site check
          pnpm --filter @openpost/site build
          pnpm --filter @openpost/docs docs:build
          pnpm run test:e2e
          pnpm run test:e2e:app
          pnpm run test:e2e:docs

          cd cli
          go mod download
          go build ./...
          go test ./...
          cd ..

          scripts/security-check.sh

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: release-preflight
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create release notes for a tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release-notes.mjs "${GITHUB_REF_NAME}" |
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --notes-file -

  build-docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: release-preflight
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name || 'dev' }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=openpost-production
          cache-to: type=gha,mode=max,scope=openpost-production

  deploy-production:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: build-docker
    steps:
      - name: Trigger the verified VPS deployment
        env:
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          payload=$(printf '{"repository":"%s","sha":"%s"}' "$GITHUB_REPOSITORY" "$GITHUB_SHA")
          signature=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$DEPLOY_WEBHOOK_SECRET" | awk '{print "sha256=" $2}')
          response=$(curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            -H "X-Hub-Signature-256: $signature" \
            --data "$payload" \
            https://webhooks.rgo.pt/hooks/deploy-openpost)
          printf '%s\n' "$response"
          grep -q 'DEPLOY_OK openpost' <<<"$response"

  build-frontend-assets:
    name: Build Frontend Assets
    runs-on: ubuntu-latest
    needs: release-preflight

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Preflight already validates the locked Devenv environment. Keep this
      # artifact-only job on the pinned application toolchain so a transient
      # Nix store reference cannot prevent packaging verified frontend assets.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @openpost/web build

      - name: Upload frontend assets
        uses: actions/upload-artifact@v4
        with:
          name: frontend-public
          path: backend/cmd/openpost/public
          if-no-files-found: error

  build-binaries:
    name: Build Release Binaries
    runs-on: ${{ matrix.runner }}
    needs: [build-frontend-assets, create-release]
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            ext: ""
          - os: darwin
            arch: arm64
            runner: macos-latest
            ext: ""
          - os: windows
            arch: amd64
            runner: ubuntu-latest
            ext: ".exe"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download frontend assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-public
          path: backend/cmd/openpost/public

      - name: Build binary
        shell: bash
        run: |
          cd backend
          version="${GITHUB_REF_NAME:-dev}"
          commit="${GITHUB_SHA:-unknown}"
          if [ "${{ matrix.os }}" = "windows" ]; then
            CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -ldflags="-s -w -X main.version=${version} -X main.commit=${commit}" -o ../openpost-server-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} ./cmd/openpost
          else
            CGO_ENABLED=1 go build -ldflags="-s -w -X main.version=${version} -X main.commit=${commit}" -o ../openpost-server-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} ./cmd/openpost
          fi

      - name: Upload binary to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: openpost-server-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-cli:
    name: Build CLI Release Binaries
    runs-on: ${{ matrix.runner }}
    needs: [release-preflight, create-release]
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            ext: ""
          - os: linux
            arch: arm64
            runner: ubuntu-latest
            ext: ""
          - os: darwin
            arch: arm64
            runner: macos-latest
            ext: ""
          - os: windows
            arch: amd64
            runner: ubuntu-latest
            ext: ".exe"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # These targets are pure Go cross-builds. Preflight already validates
      # them inside Devenv, so use the module-pinned Go toolchain directly.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Build CLI binary
        shell: bash
        run: |
          cd cli
          version="${GITHUB_REF_NAME:-dev}"
          CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -ldflags="-s -w -X main.version=${version}" -o ../openpost-cli-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} ./cmd/openpost
          CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -ldflags="-s -w -X main.version=${version}" -o ../openpost-mcp-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} ./cmd/openpost-mcp

      - name: Upload CLI binary to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            openpost-cli-*
            openpost-mcp-*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [release-preflight, create-release]
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('frontend/android/**/*.gradle*', 'frontend/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build frontend + sync Capacitor + generate Android app assets
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @openpost/web build:capacitor

      - name: Check signing secret
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode keystore
        if: steps.signing.outputs.has_keystore == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          CLEAN_B64=$(printf '%s' "$KEYSTORE_B64" | sed -e 's/^"//;s/"$//' -e "s/^'//;s/'$//" -e 's/^data:[^,]*,//' -e 's/\\n//g' -e 's/\\r//g' | tr -d '\n\r\t ')
          printf '%s' "$CLEAN_B64" | base64 -d > frontend/android/app/release-keystore.jks

      - name: Build release APK (signed)
        if: steps.signing.outputs.has_keystore == 'true'
        working-directory: frontend/android
        run: |
          ./gradlew assembleRelease \
            -PRELEASE_STORE_FILE=release-keystore.jks \
            -PRELEASE_STORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -PRELEASE_KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -PRELEASE_KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Build release APK (unsigned)
        if: steps.signing.outputs.has_keystore != 'true'
        working-directory: frontend/android
        run: ./gradlew assembleRelease

      - name: Prepare APK for upload
        run: |
          if [ "${{ steps.signing.outputs.has_keystore }}" = "true" ]; then
            cp frontend/android/app/build/outputs/apk/release/app-release.apk openpost-app-android.apk
          else
            cp frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk openpost-app-android.apk
          fi

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: openpost-app-android.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: openpost-app-android
          path: openpost-app-android.apk
          retention-days: 30
