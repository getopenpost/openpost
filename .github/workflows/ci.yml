name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer main push supersedes the previous candidate; only a completed,
  # green release-plan run writes a release proof, so a canceled run can never
  # read as coverage. Tag runs are never canceled.
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

env:
  BUN_VERSION: "1.3.11"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  plan:
    name: Plan affected surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      proof_run: ${{ steps.plan.outputs.proof_run }}
      application: ${{ steps.plan.outputs.application }}
      backend: ${{ steps.plan.outputs.backend }}
      frontend: ${{ steps.plan.outputs.frontend }}
      marketing: ${{ steps.plan.outputs.marketing }}
      documentation: ${{ steps.plan.outputs.documentation }}
      cli: ${{ steps.plan.outputs.cli }}
      n8n: ${{ steps.plan.outputs.n8n }}
      npm: ${{ steps.plan.outputs.npm }}
      security: ${{ steps.plan.outputs.security }}
      image: ${{ steps.plan.outputs.image }}
      android: ${{ steps.plan.outputs.android }}
      cache_contract: ${{ steps.plan.outputs.cache_contract }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/apps/web/static/image-editor-models/
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Plan from the fail-closed release surface registry
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            bun scripts/ci-plan.mjs --base "$BASE_SHA" --head "$GITHUB_SHA"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # A tag reuses the release proof of a green main run for the exact
            # SHA. Without one, the tag proves the full core product itself.
            # Distributions follow changes since the last published stable release.
            tag_name="${GITHUB_REF#refs/tags/}"
            previous_tag="$(bun scripts/published-release-tag.mjs --exclude "$tag_name")"
            [[ -n "$previous_tag" ]]
            proof_run="$(bun scripts/release-proof.mjs find --repository "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA")"
            if [[ -n "$proof_run" ]]; then
              bun scripts/ci-plan.mjs --reuse "$proof_run" --base "$previous_tag" --head "$GITHUB_SHA"
            else
              bun scripts/ci-plan.mjs --release --base "$previous_tag" --head "$GITHUB_SHA"
            fi
          else
            # Every main push is a release candidate, planned exactly like the
            # tag that would ship it, so a green run can prove that tag.
            previous_tag="$(bun scripts/published-release-tag.mjs)"
            [[ -n "$previous_tag" ]]
            bun scripts/ci-plan.mjs --release --base "$previous_tag" --head "$GITHUB_SHA"
          fi

  policy:
    name: Contracts and policy
    needs: plan
    if: needs.plan.outputs.mode != 'reuse'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: |
            apps/server/go.sum
            apps/cli/go.sum
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'apps/mobile/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bash scripts/ci-timing-summary.sh start policy
      - name: Install the pinned secret scanner
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - name: Install the standalone mobile app for reachability analysis
        working-directory: apps/mobile
        run: bun install --frozen-lockfile
      - name: Check formatting, generated contracts, and repository policy
        env:
          OPENPOST_SECRET_SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          OPENPOST_SECRET_SCAN_HEAD: ${{ github.sha }}
        run: bun run format:check && bun run check -- policy && bun test ./scripts
      - if: always()
        run: bash scripts/ci-timing-summary.sh finish policy

  public-build:
    name: Public artifact contract
    needs: plan
    if: needs.plan.outputs.mode != 'reuse'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/apps/web/static/image-editor-models/
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: |
            apps/server/go.sum
            apps/cli/go.sum
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # Turbo entries are content-hashed, so a stale restore only costs a miss.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openpost-turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('bun.lock', 'turbo.json', 'apps/*/turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('bun.lock', 'turbo.json', 'apps/*/turbo.json') }}-
            turbo-${{ runner.os }}-${{ github.job }}-
      - run: bash scripts/ci-timing-summary.sh start public-build
      - run: bun install --frozen-lockfile
      # Both production sites are built for this proof only, so it stays out of
      # the policy aggregate instead of rebuilding them alongside policy checks.
      - name: Prove both production artifacts and their agent surfaces
        env:
          OPENPOST_TURBO_CACHE_DIR: ${{ runner.temp }}/openpost-turbo
        run: bun run check -- public-routes
      - if: always()
        run: bash scripts/ci-timing-summary.sh finish public-build

  backend-lint:
    name: Backend and CLI lint
    needs: plan
    if: needs.plan.outputs.backend == 'true' || needs.plan.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/apps/web/static/image-editor-models/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: |
            apps/server/go.sum
            apps/cli/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bash scripts/ci-timing-summary.sh start backend-lint
      - name: Install the pinned Go linter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4
          install-only: true
      - if: needs.plan.outputs.backend == 'true'
        run: bun run lint -- backend
      - if: needs.plan.outputs.cli == 'true'
        run: bun run lint -- cli
      - if: always()
        run: bash scripts/ci-timing-summary.sh finish backend-lint

  frontend-quality:
    name: Svelte lint and checks
    needs: plan
    if: needs.plan.outputs.frontend == 'true' || needs.plan.outputs.marketing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: `bun run fallow` audits changed files against a base ref.
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/apps/web/static/image-editor-models/
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: |
            apps/server/go.sum
            apps/cli/go.sum
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # Turbo entries are content-hashed, so a stale restore only costs a miss.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openpost-turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('bun.lock', 'turbo.json', 'apps/*/turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('bun.lock', 'turbo.json', 'apps/*/turbo.json') }}-
            turbo-${{ runner.os }}-${{ github.job }}-
      - run: bash scripts/ci-timing-summary.sh start frontend-quality
      - run: bun install --frozen-lockfile
      - if: needs.plan.outputs.frontend == 'true'
        run: bun run lint -- frontend
      - if: needs.plan.outputs.marketing == 'true'
        run: bun run lint -- marketing
      - if: needs.plan.outputs.frontend == 'true' && needs.plan.outputs.marketing == 'true'
        env:
          OPENPOST_TURBO_CACHE_DIR: ${{ runner.temp }}/openpost-turbo
        run: bun run check -- frontend-marketing
      - if: needs.plan.outputs.frontend == 'true' && needs.plan.outputs.marketing != 'true'
        env:
          OPENPOST_TURBO_CACHE_DIR: ${{ runner.temp }}/openpost-turbo
        run: bun run check -- frontend
      - if: needs.plan.outputs.marketing == 'true' && needs.plan.outputs.frontend != 'true'
        env:
          OPENPOST_TURBO_CACHE_DIR: ${{ runner.temp }}/openpost-turbo
        run: bun run check -- marketing
      # Changed-source dead-code gate plus advisory complexity report.
      # Health thresholds never fail this step; unused code still does.
      - if: needs.plan.outputs.frontend == 'true' || needs.plan.outputs.marketing == 'true'
        env:
          OPENPOST_FALLOW_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          # Hotspots need historical numstat blobs, which defeats this checkout's blobless clone.
          OPENPOST_FALLOW_CI: "1"
        run: bun run fallow
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fallow-audit-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/fallow/*.json
          if-no-files-found: ignore
      - if: always()
        run: bash scripts/ci-timing-summary.sh finish frontend-quality

  backend:
    name: Backend tests (${{ matrix.shard }}/4)
    needs: plan
    if: needs.plan.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # A few packages each run longer than all others combined, so shards
        # split top-level tests by name rather than by package.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/apps/web/static/image-editor-models/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Verify or install recording analysis tools
        timeout-minutes: 5
        run: bash scripts/ci-setup-tools.sh media
      - env:
          OPENPOST_GO_COVERAGE_FILE: coverage.out
          OPENPOST_GO_TEST_RACE: "1"
          OPENPOST_GO_TEST_SHARD: ${{ matrix.shard }}/4
        run: bun run test -- backend
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: apps/server/coverage.out
          fail_ci_if_error: false

  hosted-data-plane:
    name: Hosted PostgreSQL and object storage
    needs: plan
    if: needs.plan.outputs.backend == 'true' || needs.plan.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: docker.io/library/postgres:17.9-alpine@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
        env:
          POSTGRES_DB: openpost
          POSTGRES_USER: openpost
          POSTGRES_PASSWORD: openpost-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openpost -d openpost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/apps/web/static/image-editor-models/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - run: bash scripts/ci-timing-summary.sh start hosted-data-plane
      - name: Build the pinned S3-compatible server from source
        run: |
          # quay.io refuses anonymous pulls from CI runners, so the server is
          # built from the Go module proxy instead of pulled as an image.
          # Pinned by pseudo-version; update deliberately, never floating.
          GOBIN="$RUNNER_TEMP" go install github.com/minio/minio@v0.0.0-20260212201848-7aac2a2c5b7c
      - name: Start the S3-compatible service
        env:
          MINIO_ROOT_USER: openpost-ci
          MINIO_ROOT_PASSWORD: openpost-ci-password
        run: |
          mkdir -p "$RUNNER_TEMP/minio-data"
          "$RUNNER_TEMP/minio" server "$RUNNER_TEMP/minio-data" --address :9000 > apps/server/minio.log 2>&1 &
          echo $! > "$RUNNER_TEMP/minio.pid"
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat apps/server/minio.log
          exit 1
      - name: Exercise hosted database migrations, queue claims, and object storage
        working-directory: apps/server
        env:
          OPENPOST_TEST_POSTGRES_URL: postgres://openpost:openpost-ci-password@127.0.0.1:5432/openpost?sslmode=disable
          OPENPOST_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          OPENPOST_TEST_S3_REGION: us-east-1
          OPENPOST_TEST_S3_ACCESS_KEY_ID: openpost-ci
          OPENPOST_TEST_S3_SECRET_ACCESS_KEY: openpost-ci-password
          OPENPOST_TEST_S3_BUCKET: openpost-ci-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -o pipefail
          go test -tags dev -count=1 -json \
            ./internal/database \
            ./internal/database/migrations \
            ./internal/queue \
            ./internal/services/apitokens \
            ./internal/services/billing \
            ./internal/services/credentialguard \
            ./internal/services/feedback \
            ./internal/services/medialifecycle \
            ./internal/services/mediastore \
            ./internal/services/providerwrite \
            ./internal/services/tokenmanager \
            | tee hosted-data-plane.json
          go test -tags dev -count=1 -json ./internal/api/handlers \
            -run '^TestListPublicationEventsPostgres$' \
            | tee -a hosted-data-plane.json
          if jq -s -e 'any(.[]; .Action == "skip" and .Test != null)' hosted-data-plane.json >/dev/null; then
            echo "A hosted data-plane test was skipped." >&2
            jq -r 'select(.Action == "skip" and .Test != null) | .Package + ": " + .Test' hosted-data-plane.json >&2
            exit 1
          fi
          for required_test in \
            TestListPublicationEventsPostgres \
            TestRevisionMediaReferencesMigrationPostgres \
            TestPostgresWorkersClaimDifferentDueJobsWithoutWaiting \
            TestS3CompatibleStorageIntegration; do
            jq -e --arg test "$required_test" \
              'select(.Action == "pass" and .Test == $test)' \
              hosted-data-plane.json >/dev/null || {
                echo "Required hosted data-plane test did not pass: $required_test" >&2
                exit 1
              }
          done
      - if: always()
        run: |
          kill "$(cat "$RUNNER_TEMP/minio.pid")" 2>/dev/null || true
          bash scripts/ci-timing-summary.sh finish hosted-data-plane
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-data-plane-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            apps/server/hosted-data-plane.json
            apps/server/minio.log
          if-no-files-found: ignore
          retention-days: 14

  frontend-tests:
    name: Frontend tests (${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The web package keeps its shards serial on laptops for memory; CI
        # runs each shard (plus the server project and shared packages) apart.
        shard: [server, 1/6, 2/6, 3/6, 4/6, 5/6, 6/6, packages]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # Only the shared-packages shard runs Turbo; the web shards run Vitest directly.
      - if: matrix.shard == 'packages'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openpost-turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('bun.lock', 'turbo.json', 'apps/*/turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('bun.lock', 'turbo.json', 'apps/*/turbo.json') }}-
            turbo-${{ runner.os }}-${{ github.job }}-
      - run: bun install --frozen-lockfile
      - name: Install pinned Chromium and system dependencies
        timeout-minutes: 5
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "60000"
        run: bunx --no-install playwright install --with-deps chromium
      - if: matrix.shard != 'packages'
        working-directory: apps/web
        env:
          # Retain process diagnostics for browser and module-loader failures.
          DEBUG: pw:browser
        run: |
          bun run sync
          if [[ "${{ matrix.shard }}" == server ]]; then
            bun run test:browser-tools
            bunx vitest run --project server
          else
            bun run test:browser ${{ matrix.shard }}
          fi
      - if: matrix.shard == 'packages'
        env:
          OPENPOST_TURBO_CACHE_DIR: ${{ runner.temp }}/openpost-turbo
        run: bunx turbo run test --filter @openpost/query-catalog --filter @openpost/telemetry --filter @openpost/social-preview
      - name: Retain component browser failure screenshots
        if: failure() && matrix.shard != 'server' && matrix.shard != 'packages'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-browser-failure-${{ strategy.job-index }}-${{ github.sha }}-${{ github.run_attempt }}
          path: apps/web/src/**/__screenshots__/**
          if-no-files-found: ignore
          retention-days: 7

  frontend-build:
    name: Canonical frontend build
    needs: plan
    if: needs.plan.outputs.application == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # Turbo entries are content-hashed, so a stale restore only costs a miss.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openpost-turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('bun.lock', 'turbo.json', 'apps/*/turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('bun.lock', 'turbo.json', 'apps/*/turbo.json') }}-
            turbo-${{ runner.os }}-${{ github.job }}-
      - run: bash scripts/ci-timing-summary.sh start frontend-build
      - run: bun install --frozen-lockfile
      - name: Build the canonical application artifact and source maps
        env:
          OPENPOST_TURBO_CACHE_DIR: ${{ runner.temp }}/openpost-turbo
          POSTHOG_SOURCEMAPS_ENABLED: ${{ github.event_name == 'push' && secrets.POSTHOG_PERSONAL_API_KEY != '' && vars.POSTHOG_PROJECT_ID != '' && '1' || '0' }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          POSTHOG_UI_HOST: ${{ vars.POSTHOG_UI_HOST }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: bun run build -- frontend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-public-${{ github.sha }}-${{ github.run_attempt }}
          path: apps/server/cmd/openpost/public
          if-no-files-found: error
          retention-days: 14
      - if: always()
        run: bash scripts/ci-timing-summary.sh finish frontend-build

  marketing-build:
    name: Marketing build
    needs: plan
    if: needs.plan.outputs.marketing == 'true' || needs.plan.outputs.application == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # Turbo entries are content-hashed, so a stale restore only costs a miss.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openpost-turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('bun.lock', 'turbo.json', 'apps/*/turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('bun.lock', 'turbo.json', 'apps/*/turbo.json') }}-
            turbo-${{ runner.os }}-${{ github.job }}-
      - name: Build canonical marketing artifact and source maps
        env:
          OPENPOST_TURBO_CACHE_DIR: ${{ runner.temp }}/openpost-turbo
          # Fork pull requests cannot read repository variables. Their prebuilt
          # browser artifact needs analytics enabled against the local fixture.
          VITE_POSTHOG_PROJECT_TOKEN: ${{ github.event_name == 'pull_request' && 'phc_browser_fixture' || vars.POSTHOG_PROJECT_TOKEN }}
          VITE_POSTHOG_API_HOST: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:4322' || vars.POSTHOG_BROWSER_HOST }}
          VITE_POSTHOG_UI_HOST: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:4322' || vars.POSTHOG_UI_HOST }}
          VITE_OPENPOST_ENVIRONMENT: ${{ github.event_name == 'push' && 'production' || 'ci' }}
          VITE_OPENPOST_REVISION: ${{ github.sha }}
          POSTHOG_SOURCEMAPS_ENABLED: ${{ github.event_name == 'push' && secrets.POSTHOG_PERSONAL_API_KEY != '' && vars.POSTHOG_PROJECT_ID != '' && '1' || '0' }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          POSTHOG_UI_HOST: ${{ vars.POSTHOG_UI_HOST }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: bun run build -- marketing
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: marketing-static-${{ github.sha }}-${{ github.run_attempt }}
          path: apps/marketing/dist
          if-no-files-found: error
          retention-days: 14

  docs-build:
    name: Documentation build
    needs: plan
    if: needs.plan.outputs.documentation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/apps/web/static/image-editor-models/
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: |
            apps/server/go.sum
            apps/cli/go.sum
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # Turbo entries are content-hashed, so a stale restore only costs a miss.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openpost-turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('bun.lock', 'turbo.json', 'apps/*/turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('bun.lock', 'turbo.json', 'apps/*/turbo.json') }}-
            turbo-${{ runner.os }}-${{ github.job }}-
      - name: Build canonical documentation artifact and source maps
        env:
          OPENPOST_TURBO_CACHE_DIR: ${{ runner.temp }}/openpost-turbo
          VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
          VITE_POSTHOG_API_HOST: ${{ vars.POSTHOG_BROWSER_HOST }}
          VITE_POSTHOG_UI_HOST: ${{ vars.POSTHOG_UI_HOST }}
          VITE_OPENPOST_ENVIRONMENT: ${{ github.event_name == 'push' && 'production' || 'ci' }}
          VITE_OPENPOST_REVISION: ${{ github.sha }}
          POSTHOG_SOURCEMAPS_ENABLED: ${{ github.event_name == 'push' && secrets.POSTHOG_PERSONAL_API_KEY != '' && vars.POSTHOG_PROJECT_ID != '' && '1' || '0' }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          POSTHOG_UI_HOST: ${{ vars.POSTHOG_UI_HOST }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: bun run build -- docs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-static-${{ github.sha }}-${{ github.run_attempt }}
          path: apps/docs/out
          if-no-files-found: error
          retention-days: 14

  browser-app:
    name: Application browser suite (${{ matrix.shard }}/6)
    strategy:
      fail-fast: false
      matrix:
        # Each shard runs one worker against its own server, so wall time
        # follows the shard count. This suite is the candidate's longest pole.
        shard: [1, 2, 3, 4, 5, 6]
    needs: [plan, frontend-build, marketing-build]
    if: needs.plan.outputs.application == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/apps/web/static/image-editor-models/
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Resolve the newest canonical application artifact
        id: frontend-artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_name="$(bun scripts/ci-artifacts.mjs resolve --repository "${GITHUB_REPOSITORY}" --run-id "${GITHUB_RUN_ID}" --prefix "frontend-public-${GITHUB_SHA}-")"
          echo "name=${artifact_name}" >> "${GITHUB_OUTPUT}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.frontend-artifact.outputs.name }}
          path: apps/server/cmd/openpost/public
      - name: Resolve the marketing artifact for tool-to-draft handoffs
        id: marketing-artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_name="$(bun scripts/ci-artifacts.mjs resolve --repository "${GITHUB_REPOSITORY}" --run-id "${GITHUB_RUN_ID}" --prefix "marketing-static-${GITHUB_SHA}-")"
          echo "name=${artifact_name}" >> "${GITHUB_OUTPUT}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.marketing-artifact.outputs.name }}
          path: apps/marketing/dist
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - run: bun install --frozen-lockfile
      - name: Install pinned Chromium and system dependencies
        timeout-minutes: 5
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "60000"
        run: bunx --no-install playwright install --with-deps chromium
      - name: Verify or install media fixture tools
        timeout-minutes: 5
        run: bash scripts/ci-setup-tools.sh media
      - name: Test the canonical application artifact
        env:
          OPENPOST_E2E_PREBUILT: "1"
          DEBUG: pw:browser
          OPENPOST_APP_E2E_SHARD: ${{ matrix.shard }}/6
        run: bun run test -- e2e-app
      - name: Retain application browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-app-failure-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  browser-marketing:
    name: Marketing browser suite
    needs: [plan, marketing-build]
    if: needs.plan.outputs.marketing == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/apps/web/static/image-editor-models/
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Resolve the newest canonical marketing artifact
        id: marketing-artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_name="$(bun scripts/ci-artifacts.mjs resolve --repository "${GITHUB_REPOSITORY}" --run-id "${GITHUB_RUN_ID}" --prefix "marketing-static-${GITHUB_SHA}-")"
          echo "name=${artifact_name}" >> "${GITHUB_OUTPUT}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.marketing-artifact.outputs.name }}
          path: apps/marketing/dist
      - run: bun install --frozen-lockfile
      - name: Install pinned Chromium and system dependencies
        timeout-minutes: 5
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "60000"
        run: bunx --no-install playwright install --with-deps chromium
      - name: Verify or install media conversion fixture tools
        timeout-minutes: 5
        run: bash scripts/ci-setup-tools.sh media
      - env:
          OPENPOST_E2E_PREBUILT: "1"
        run: bun run test -- e2e
      - name: Collect marketing browser diagnostics
        if: failure()
        run: |
          mkdir -p marketing-browser-diagnostics
          if [ -d "$HOME/.config/.wrangler/logs" ]; then
            cp -R "$HOME/.config/.wrangler/logs" marketing-browser-diagnostics/wrangler-logs
          fi
      - name: Retain marketing browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-marketing-failure-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
            marketing-browser-diagnostics
          if-no-files-found: ignore
          retention-days: 7

  cache-contract:
    name: Frontend cache contract
    needs: plan
    if: needs.plan.outputs.cache_contract == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run check -- frontend-build-cache

  npm-packages:
    name: npm SDK and CLI packages
    needs: plan
    if: needs.plan.outputs.npm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/apps/web/static/image-editor-models/
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Require a package version increase for publishable changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            # Main candidates compare with the same base as the tag that ships them.
            BASE_SHA="$(bun scripts/published-release-tag.mjs)"
          elif [[ "$BASE_SHA" =~ ^0+$ ]]; then
            if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              # A new tag has no previous commit in the push event, so compare
              # the tagged package sources with the previous published release.
              BASE_SHA="$(bun scripts/published-release-tag.mjs --exclude "$GITHUB_REF_NAME")"
              echo "Comparing tagged package versions against $BASE_SHA."
            else
              echo "Initial repository push has no version base."
              exit 0
            fi
          fi
          bun scripts/npm-package-release.mjs check-version --package packages/sdk --base "$BASE_SHA" --head "$GITHUB_SHA"
          bun scripts/npm-package-release.mjs check-version --package packages/cli --base "$BASE_SHA" --head "$GITHUB_SHA"
      - name: Check, test, and build the packages
        run: bun scripts/tasks.mjs check npm-packages
      - name: Inspect the exact SDK npm payload
        working-directory: packages/sdk
        run: npm pack --dry-run --ignore-scripts
      - name: Inspect the exact CLI npm payload
        working-directory: packages/cli
        run: npm pack --dry-run --ignore-scripts

  n8n:
    name: n8n community package
    needs: plan
    if: needs.plan.outputs.n8n == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/apps/web/static/image-editor-models/
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Require a package version increase for publishable changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/* ]]; then
            BASE_SHA="$(bun scripts/published-release-tag.mjs --exclude "$GITHUB_REF_NAME")"
          elif [[ "$EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            # Main candidates compare with the same base as the tag that ships them.
            BASE_SHA="$(bun scripts/published-release-tag.mjs)"
          elif [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo "Initial repository push has no version base."
            exit 0
          fi
          bun scripts/n8n-package-release.mjs check-version --base "$BASE_SHA" --head "$GITHUB_SHA"
      - name: Check, test, lint, build, and load the package
        run: bun run check:n8n
      - name: Inspect the exact npm payload
        working-directory: packages/n8n-nodes-openpost
        run: npm pack --dry-run --ignore-scripts

  security:
    name: Security
    needs: plan
    if: needs.plan.outputs.security == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/apps/web/static/image-editor-models/
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: |
            apps/server/go.sum
            apps/cli/go.sum
      - run: bun install --frozen-lockfile
      - run: scripts/security-check.sh

  cli:
    name: CLI
    needs: plan
    if: needs.plan.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/apps/web/static/image-editor-models/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun run build -- cli
      - run: bun run test -- cli

  android:
    name: Native mobile Android candidate
    needs: plan
    if: needs.plan.outputs.android == 'true' && needs.plan.outputs.mode != 'reuse'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "21"
          distribution: temurin
      - name: Install Android SDK components
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;27.1.12297006
            cmake;3.22.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-build-v2-${{ runner.os }}-${{ hashFiles('apps/mobile/bun.lock', 'apps/mobile/plugins/**') }}-${{ github.sha }}
          restore-keys: |
            android-build-v2-${{ runner.os }}-${{ hashFiles('apps/mobile/bun.lock', 'apps/mobile/plugins/**') }}-
            android-build-v2-${{ runner.os }}-
            android-${{ runner.os }}-
      - name: Install the standalone mobile app
        working-directory: apps/mobile
        run: bun install --frozen-lockfile
      - name: Verify the standalone mobile install
        working-directory: apps/mobile
        # Bun occasionally leaves registry and file: dependencies unlinked
        # after a cached install; tsc then fails with dozens of cascading
        # errors. Show the tree and repair loudly instead of debugging
        # type noise.
        run: |
          ls node_modules/@tanstack/ node_modules/@openpost/ || true
          if [ ! -f node_modules/@tanstack/query-core/package.json ] || [ ! -f node_modules/@openpost/api-contract/package.json ]; then
            rm -rf node_modules
            bun install --frozen-lockfile --no-cache
          fi
          test -f node_modules/@tanstack/query-core/package.json
          test -f node_modules/@openpost/api-contract/package.json
      - name: Check the standalone mobile app
        working-directory: apps/mobile
        run: bun run check
      - name: Check the current Android release identity
        working-directory: apps/mobile
        run: |
          latest_tag="$(git for-each-ref --count=1 --sort=-version:refname --format='%(refname:short)' 'refs/tags/v*')"
          [[ -n "$latest_tag" ]]
          git show "$latest_tag:apps/mobile/app.json" > previous-release-app.json
          bun ../../scripts/mobile-release.mjs check-current \
            --config app.json \
            --package package.json \
            --previous-config previous-release-app.json
      - name: Build the native Expo Android candidate
        working-directory: apps/mobile
        run: bun run build:android:candidate
      - run: |
          cp apps/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk openpost-app-android-unsigned.apk
          unzip -t openpost-app-android-unsigned.apk
          sha256sum openpost-app-android-unsigned.apk > openpost-app-android-unsigned.sha256
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks apps/mobile/android/app/debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out openpost-app-android-preview.apk \
            openpost-app-android-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose openpost-app-android-preview.apk
          sha256sum openpost-app-android-preview.apk > openpost-app-android-preview.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-unsigned-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            openpost-app-android-unsigned.apk
            openpost-app-android-unsigned.sha256
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-preview-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            openpost-app-android-preview.apk
            openpost-app-android-preview.sha256
          if-no-files-found: error
          retention-days: 14

  candidate-relay:
    name: Relay proven candidate artifacts
    needs: plan
    if: needs.plan.outputs.mode == 'reuse'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Resolve the proven artifacts
        id: proven
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_RUN: ${{ needs.plan.outputs.proof_run }}
          ANDROID: ${{ needs.plan.outputs.android }}
        shell: bash
        run: |
          frontend="$(bun scripts/ci-artifacts.mjs resolve --repository "${GITHUB_REPOSITORY}" --run-id "${PROOF_RUN}" --prefix "frontend-public-${GITHUB_SHA}-")"
          android=""
          if [[ "$ANDROID" == true ]]; then
            android="$(bun scripts/ci-artifacts.mjs resolve --repository "${GITHUB_REPOSITORY}" --run-id "${PROOF_RUN}" --prefix "android-unsigned-${GITHUB_SHA}-")"
          fi
          {
            echo "frontend=$frontend"
            echo "android=$android"
          } >> "$GITHUB_OUTPUT"
      # The tag run republishes the proven bytes under its own run so the
      # release workflow and image build resolve them exactly as before.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.proven.outputs.frontend }}
          path: proven-frontend
          run-id: ${{ needs.plan.outputs.proof_run }}
          github-token: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-public-${{ github.sha }}-${{ github.run_attempt }}
          path: proven-frontend
          if-no-files-found: error
          retention-days: 14
      - if: needs.plan.outputs.android == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.proven.outputs.android }}
          path: proven-android
          run-id: ${{ needs.plan.outputs.proof_run }}
          github-token: ${{ github.token }}
      - if: needs.plan.outputs.android == 'true'
        name: Verify the proven Android checksum
        run: cd proven-android && sha256sum --check openpost-app-android-unsigned.sha256
      - if: needs.plan.outputs.android == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-unsigned-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            proven-android/openpost-app-android-unsigned.apk
            proven-android/openpost-app-android-unsigned.sha256
          if-no-files-found: error
          retention-days: 14

  image:
    name: Production image (linux/${{ matrix.arch }})
    needs: [plan, frontend-build, candidate-relay]
    if: ${{ !cancelled() && needs.plan.outputs.image == 'true' && (needs.frontend-build.result == 'success' || needs.candidate-relay.result == 'success') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/apps/web/static/image-editor-models/
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Resolve the successful frontend artifact
        id: frontend-artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_name="$(bun scripts/ci-artifacts.mjs resolve --repository "${GITHUB_REPOSITORY}" --run-id "${GITHUB_RUN_ID}" --prefix "frontend-public-${GITHUB_SHA}-")"
          echo "name=${artifact_name}" >> "${GITHUB_OUTPUT}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.frontend-artifact.outputs.name }}
          path: apps/server/cmd/openpost/public
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image version
        id: version
        shell: bash
        run: |
          version="sha-${GITHUB_SHA}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
            bun scripts/release-notes.mjs "$version" >/dev/null
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build the candidate once
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}-${{ matrix.arch }}"
          docker buildx build --load --platform "linux/${{ matrix.arch }}" --build-context frontend_artifact=apps/server/cmd/openpost/public --file deploy/docker/Dockerfile --tag "$image" --build-arg VERSION="${{ steps.version.outputs.version }}" --build-arg COMMIT="$GITHUB_SHA" --cache-from type=gha,scope="openpost-production-${{ matrix.arch }}" --cache-to type=gha,mode=max,scope="openpost-production-${{ matrix.arch }}" .
          scripts/smoke-production-image.sh "$image" "$GITHUB_SHA" "${{ steps.version.outputs.version }}" "${{ matrix.arch }}"
      - name: Generate the final-image SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}-${{ matrix.arch }}
          scan-type: image
          scanners: vuln
          format: spdx-json
          output: openpost-image-${{ matrix.arch }}.spdx.json
          version: v0.70.0
      - name: Record the full final-image vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}-${{ matrix.arch }}
          scan-type: image
          scanners: vuln
          format: json
          output: openpost-image-${{ matrix.arch }}-trivy.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 0
          version: v0.70.0
      - name: Retain image scan reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-diagnostics-${{ github.sha }}-${{ matrix.arch }}-${{ github.run_attempt }}
          path: |
            openpost-image-${{ matrix.arch }}.spdx.json
            openpost-image-${{ matrix.arch }}-trivy.json
          if-no-files-found: error
          retention-days: 14
      - name: Block fixable high-severity vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}-${{ matrix.arch }}
          scan-type: image
          scanners: vuln
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
          version: v0.70.0
      - name: Publish the validated candidate and record its digest
        if: github.event_name == 'push'
        id: publish
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}-${{ matrix.arch }}"
          docker push "$image"
          raw_manifest="$(docker buildx imagetools inspect --raw "$image")"
          if jq -e 'has("manifests")' <<< "$raw_manifest" >/dev/null; then
            digest="$(jq -r --arg architecture "${{ matrix.arch }}" '
              [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $architecture)]
              | if length == 1 then .[0].digest else empty end
            ' <<< "$raw_manifest")"
          else
            digest="$(docker buildx imagetools inspect "$image" | awk '$1 == "Digest:" && !found { print $2; found = 1 }')"
          fi
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "Published candidate did not resolve to a registry digest." >&2; exit 1; }
          printf '%s\n' "$digest" > "image-linux-${{ matrix.arch }}-digest.txt"
      - name: Retain tested platform digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: image-platform-digest-${{ github.sha }}-${{ matrix.arch }}-${{ github.run_attempt }}
          path: image-linux-${{ matrix.arch }}-digest.txt
          if-no-files-found: error
          retention-days: 14

  image-index:
    name: Production image index
    needs: [plan, image]
    if: ${{ !cancelled() && needs.plan.outputs.image == 'true' && needs.image.result == 'success' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Resolve the successful platform artifacts
        id: platform-artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          amd64="$(bun scripts/ci-artifacts.mjs resolve --repository "${GITHUB_REPOSITORY}" --run-id "${GITHUB_RUN_ID}" --prefix "image-platform-digest-${GITHUB_SHA}-amd64-")"
          arm64="$(bun scripts/ci-artifacts.mjs resolve --repository "${GITHUB_REPOSITORY}" --run-id "${GITHUB_RUN_ID}" --prefix "image-platform-digest-${GITHUB_SHA}-arm64-")"
          {
            echo "amd64=$amd64"
            echo "arm64=$arm64"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.platform-artifacts.outputs.amd64 }}
          path: tested-platforms
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.platform-artifacts.outputs.arm64 }}
          path: tested-platforms
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the multi-architecture candidate
        shell: bash
        run: |
          set -euo pipefail
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          amd64_digest="$(cat tested-platforms/image-linux-amd64-digest.txt)"
          arm64_digest="$(cat tested-platforms/image-linux-arm64-digest.txt)"
          for digest in "$amd64_digest" "$arm64_digest"; do
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || {
              echo "Invalid tested platform digest: $digest" >&2
              exit 1
            }
          done
          candidate="${repository}:sha-${GITHUB_SHA}"
          docker buildx imagetools create \
            --tag "$candidate" \
            "${repository}@${amd64_digest}" \
            "${repository}@${arm64_digest}"
          digest="$(docker buildx imagetools inspect "$candidate" | awk '$1 == "Digest:" && !found { print $2; found = 1 }')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || {
            echo "Published candidate index did not resolve to a registry digest." >&2
            exit 1
          }
          docker buildx imagetools inspect --raw "$candidate" | jq -e \
            --arg amd64 "$amd64_digest" \
            --arg arm64 "$arm64_digest" '
              [.manifests[] | select(.platform.os == "linux")] as $linux
              | ($linux | length) == 2
              and any($linux[]; .platform.architecture == "amd64" and .digest == $amd64)
              and any($linux[]; .platform.architecture == "arm64" and .digest == $arm64)
            ' >/dev/null
          printf '%s\n' "$digest" > image-digest.txt
          cp tested-platforms/image-linux-amd64-digest.txt .
          cp tested-platforms/image-linux-arm64-digest.txt .
      - name: Retain tested image index
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            image-digest.txt
            image-linux-amd64-digest.txt
            image-linux-arm64-digest.txt
          if-no-files-found: error
          retention-days: 14

  release-candidate:
    name: Release Candidate
    if: always()
    needs:
      [
        plan,
        policy,
        public-build,
        backend-lint,
        frontend-quality,
        backend,
        hosted-data-plane,
        frontend-tests,
        frontend-build,
        marketing-build,
        docs-build,
        browser-app,
        browser-marketing,
        cache-contract,
        n8n,
        npm-packages,
        security,
        cli,
        android,
        candidate-relay,
        image,
        image-index,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Write matrix timing summary
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          {
            echo "## CI job timings"
            echo
            echo "| Job | Result | Wall time |"
            echo "| --- | --- | ---: |"
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
              --jq '.jobs[] | select(.completed_at != null) | [.name, .conclusion, .started_at, .completed_at] | @tsv' |
              while IFS=$'\t' read -r name conclusion started completed; do
                started_epoch="$(date --date="$started" +%s)"
                completed_epoch="$(date --date="$completed" +%s)"
                elapsed="$(( completed_epoch - started_epoch ))"
                printf '| %s | %s | %dm %02ds |\n' "$name" "$conclusion" "$(( elapsed / 60 ))" "$(( elapsed % 60 ))"
              done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Require every planned check
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          printf 'Job results: %s\n' "$RESULTS"
          [[ "$RESULTS" != *failure* && "$RESULTS" != *cancelled* ]]
      # Only a green release-plan main run proves its SHA for a later tag.
      - name: Record the release proof for this exact revision
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.mode == 'release'
        env:
          PLAN_JSON: ${{ toJSON(needs.plan.outputs) }}
        run: |
          jq -n --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --argjson plan "$PLAN_JSON" \
            '{sha: $sha, run_id: $run, run_attempt: $attempt, plan: $plan}' > release-proof.json
          cat release-proof.json
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.mode == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-proof-${{ github.sha }}-${{ github.run_attempt }}
          path: release-proof.json
          if-no-files-found: error
          retention-days: 14
