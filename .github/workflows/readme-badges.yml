name: README badges

on:
  schedule:
    - cron: "23 */6 * * *"
  release:
    types: [published]
  workflow_run:
    workflows: [CI, "Build and Release"]
    types: [in_progress, completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: readme-badges
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.name == 'Build and Release'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Generate current GitHub counts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/generate-readme-badges.mjs

      - name: Commit changed badges
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/badges
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh README badges [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
