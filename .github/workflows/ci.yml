name: CI

on:
  push:
    branches: [main]
    # Release bookkeeping was validated before publication. Pages still
    # receives the push, so the public changelog can deploy.
    paths-ignore: ["CHANGELOG.md", "changes/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || github.event_name == 'schedule' && 'qualification' || github.ref }}
  # Superseded feedback can stop. Tags and nightly audits stay independent.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  plan:
    name: Plan affected surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      application: ${{ steps.plan.outputs.application }}
      backend: ${{ steps.plan.outputs.backend }}
      frontend: ${{ steps.plan.outputs.frontend }}
      marketing: ${{ steps.plan.outputs.marketing }}
      documentation: ${{ steps.plan.outputs.documentation }}
      cli: ${{ steps.plan.outputs.cli }}
      n8n: ${{ steps.plan.outputs.n8n }}
      npm: ${{ steps.plan.outputs.npm }}
      security: ${{ steps.plan.outputs.security }}
      image: ${{ steps.plan.outputs.image }}
      android: ${{ steps.plan.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/apps/web/static/image-editor-models/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - name: Plan from the fail-closed release surface registry
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            bun scripts/ci-plan.mjs --base "$BASE_SHA" --head "$GITHUB_SHA"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Core gates always run; distributions follow changes since the
            # last published stable release.
            previous_tag="$(bun scripts/published-release-tag.mjs --exclude "${GITHUB_REF#refs/tags/}")"
            [[ -n "$previous_tag" ]]
            bun scripts/ci-plan.mjs --release --base "$previous_tag" --head "$GITHUB_SHA"
          elif [[ "$EVENT_NAME" == schedule || "$EVENT_NAME" == workflow_dispatch ]]; then
            previous_tag="$(bun scripts/published-release-tag.mjs)"
            [[ -n "$previous_tag" ]]
            bun scripts/ci-plan.mjs --release --full --base "$previous_tag" --head "$GITHUB_SHA"
          elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]] && git cat-file -e "$BEFORE_SHA^{commit}" && git merge-base --is-ancestor "$BEFORE_SHA" "$GITHUB_SHA"; then
            bun scripts/ci-plan.mjs --base "$BEFORE_SHA" --head "$GITHUB_SHA"
          else
            # Unknown push ancestry widens checks rather than skipping them.
            bun scripts/ci-plan.mjs --full
          fi

  web-quality:
    name: Format, policy, lint and types
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fallow and the secret scan compare changed files against a base.
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          go: "true"
          node: "true"
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Install the pinned secret scanner
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install the standalone mobile app for reachability analysis
        working-directory: apps/mobile
        run: bun install --frozen-lockfile
      - run: bun run format:check
      - name: Generated contracts and repository policy
        env:
          OPENPOST_SECRET_SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          OPENPOST_SECRET_SCAN_HEAD: ${{ github.sha }}
        run: bun run check -- policy && bun test --timeout 30000 ./scripts
      - if: needs.plan.outputs.frontend == 'true' || needs.plan.outputs.marketing == 'true'
        run: bun run lint -- frontend && bun run lint -- marketing
      - if: needs.plan.outputs.frontend == 'true' || needs.plan.outputs.marketing == 'true'
        run: bun run check -- frontend-marketing
      - if: needs.plan.outputs.frontend == 'true' || needs.plan.outputs.marketing == 'true'
        name: Changed-source dead-code gate
        env:
          OPENPOST_FALLOW_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          OPENPOST_FALLOW_CI: "1"
        run: bun run fallow
      - if: needs.plan.outputs.security == 'true'
        run: scripts/security-check.sh

  go-quality:
    name: Go lint and CLI
    needs: plan
    if: needs.plan.outputs.backend == 'true' || needs.plan.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/apps/web/static/image-editor-models/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup
        with:
          go: "true"
          install: "false"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-only: true
      - if: needs.plan.outputs.backend == 'true'
        run: bun run lint -- backend
      - if: needs.plan.outputs.cli == 'true'
        run: bun run lint -- cli && bun run build -- cli && bun run test -- cli

  backend:
    name: Backend tests${{ matrix.shard != 'all' && format(' ({0})', matrix.shard) || '' }}
    needs: plan
    if: needs.plan.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # The nightly run adds the race detector and coverage, which is several
        # times slower, so it splits top-level tests across four shards.
        shard: ${{ fromJSON(github.event_name == 'schedule' && '["1/4","2/4","3/4","4/4"]' || '["all"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/apps/web/static/image-editor-models/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup
        with:
          go: "true"
          install: "false"
          media: "true"
      - env:
          OPENPOST_GO_TEST_SHARD: ${{ matrix.shard != 'all' && matrix.shard || '' }}
          OPENPOST_GO_TEST_RACE: ${{ github.event_name == 'schedule' && '1' || '' }}
          OPENPOST_GO_COVERAGE_FILE: ${{ github.event_name == 'schedule' && 'coverage.out' || '' }}
        run: bun run test -- backend
      - if: github.event_name == 'schedule'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: apps/server/coverage.out
          fail_ci_if_error: false

  hosted-data-plane:
    name: Hosted PostgreSQL and object storage
    needs: plan
    if: needs.plan.outputs.backend == 'true' || needs.plan.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: docker.io/library/postgres:17.9-alpine@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
        env:
          POSTGRES_DB: openpost
          POSTGRES_USER: openpost
          POSTGRES_PASSWORD: openpost-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openpost -d openpost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      # The same S3-compatible server the local `hosted` devenv profile runs.
      rustfs:
        image: docker.io/rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
        env:
          RUSTFS_ACCESS_KEY: openpost-ci
          RUSTFS_SECRET_KEY: openpost-ci-password
        ports:
          - 9000:9000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/apps/web/static/image-editor-models/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup
        with:
          go: "true"
          install: "false"
      - name: Wait for the S3-compatible service
        run: |
          for _ in {1..60}; do
            curl --silent --output /dev/null http://127.0.0.1:9000/ && exit 0
            sleep 1
          done
          exit 1
      - name: Exercise hosted database migrations, queue claims, and object storage
        env:
          OPENPOST_TEST_POSTGRES_URL: postgres://openpost:openpost-ci-password@127.0.0.1:5432/openpost?sslmode=disable
          OPENPOST_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          OPENPOST_TEST_S3_REGION: us-east-1
          OPENPOST_TEST_S3_ACCESS_KEY_ID: openpost-ci
          OPENPOST_TEST_S3_SECRET_ACCESS_KEY: openpost-ci-password
          OPENPOST_TEST_S3_BUCKET: openpost-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash scripts/test-hosted-data-plane.sh
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-data-plane-${{ github.sha }}-${{ github.run_attempt }}
          path: apps/server/hosted-data-plane.json
          if-no-files-found: ignore
          retention-days: 7

  frontend-tests:
    name: Frontend tests (${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Unit tests and shared packages run together; component shards run
        # in Chromium with one worker each.
        shard: [unit, 1/4, 2/4, 3/4, 4/4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          node: "true"
          chromium: ${{ matrix.shard == 'unit' && 'shell' || 'full' }}
      - working-directory: apps/web
        env:
          DEBUG: ${{ matrix.shard != 'unit' && 'pw:browser' || '' }}
        run: |
          bun run sync
          if [[ "${{ matrix.shard }}" == unit ]]; then
            bunx vitest run --project server
            cd ../.. && bunx turbo run test --filter @openpost/query-catalog --filter @openpost/telemetry --filter @openpost/social-preview
          else
            bun run test:browser ${{ matrix.shard }}
          fi
      - if: failure() && matrix.shard != 'unit'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-browser-failure-${{ strategy.job-index }}-${{ github.sha }}-${{ github.run_attempt }}
          path: apps/web/src/**/__screenshots__/**
          if-no-files-found: ignore
          retention-days: 7

  frontend-build:
    name: Canonical frontend build
    needs: plan
    if: needs.plan.outputs.application == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          node: "true"
      - name: Build the canonical application artifact and source maps
        env:
          POSTHOG_SOURCEMAPS_ENABLED: ${{ github.event_name == 'push' && secrets.POSTHOG_PERSONAL_API_KEY != '' && vars.POSTHOG_PROJECT_ID != '' && '1' || '0' }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          POSTHOG_UI_HOST: ${{ vars.POSTHOG_UI_HOST }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: bun run build -- frontend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-public-${{ github.sha }}-${{ github.run_attempt }}
          path: apps/server/cmd/openpost/public
          if-no-files-found: error
          retention-days: 14

  public-site:
    name: Public site build and artifact contract
    needs: plan
    if: needs.plan.outputs.marketing == 'true' || needs.plan.outputs.documentation == 'true' || needs.plan.outputs.application == 'true' || needs.plan.outputs.mode != 'filtered'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VITE_OPENPOST_ENVIRONMENT: ${{ github.event_name == 'push' && 'production' || 'ci' }}
      VITE_OPENPOST_REVISION: ${{ github.sha }}
      POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
      POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
      POSTHOG_UI_HOST: ${{ vars.POSTHOG_UI_HOST }}
      POSTHOG_SOURCEMAPS_ENABLED: ${{ github.event_name == 'push' && secrets.POSTHOG_PERSONAL_API_KEY != '' && vars.POSTHOG_PROJECT_ID != '' && '1' || '0' }}
      GITHUB_SHA: ${{ github.sha }}
      GITHUB_RUN_ID: ${{ github.run_id }}
      # Fork pull requests cannot read repository variables. The marketing
      # browser artifact needs analytics enabled against the local fixture.
      OPENPOST_MARKETING_POSTHOG_PROJECT_TOKEN: ${{ github.event_name == 'pull_request' && 'phc_browser_fixture' || vars.POSTHOG_PROJECT_TOKEN }}
      OPENPOST_MARKETING_POSTHOG_API_HOST: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:4322' || vars.POSTHOG_BROWSER_HOST }}
      OPENPOST_MARKETING_POSTHOG_UI_HOST: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:4322' || vars.POSTHOG_UI_HOST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          go: "true"
          node: "true"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/docs-inputs
          key: docs-inputs-${{ runner.os }}-${{ github.sha }}
          restore-keys: docs-inputs-${{ runner.os }}-
      - name: Build marketing
        env:
          VITE_POSTHOG_PROJECT_TOKEN: ${{ env.OPENPOST_MARKETING_POSTHOG_PROJECT_TOKEN }}
          VITE_POSTHOG_API_HOST: ${{ env.OPENPOST_MARKETING_POSTHOG_API_HOST }}
          VITE_POSTHOG_UI_HOST: ${{ env.OPENPOST_MARKETING_POSTHOG_UI_HOST }}
        run: bun run build -- marketing
      - name: Build documentation
        env:
          VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
          VITE_POSTHOG_API_HOST: ${{ vars.POSTHOG_BROWSER_HOST }}
          VITE_POSTHOG_UI_HOST: ${{ vars.POSTHOG_UI_HOST }}
        run: bun run build -- docs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: marketing-static-${{ github.sha }}-${{ github.run_attempt }}
          path: apps/marketing/dist
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - run: timeout 120 bun scripts/compose-public-site.mjs
      - name: Seal the canonical public candidate before rebuild proofs
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')))
        run: |
          mkdir -p delivery
          cp -R dist/public-site delivery/site
          config=$(bun scripts/public-site-artifact.mjs config)
          timeout 120 bun scripts/public-site-artifact.mjs seal delivery/site delivery/manifest.json "$GITHUB_SHA" "$config"
      - name: Prove both production artifacts and their agent surfaces
        env:
          # Independent rebuilds prove semantics without uploading duplicate symbols.
          POSTHOG_SOURCEMAPS_ENABLED: "0"
          OPENPOST_PUBLIC_ARTIFACTS_PREBUILT: "1"
          VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
          VITE_POSTHOG_API_HOST: ${{ vars.POSTHOG_BROWSER_HOST }}
          VITE_POSTHOG_UI_HOST: ${{ vars.POSTHOG_UI_HOST }}
        run: |
          bun test ./tests/build/generate-agent-surfaces.test.mjs
          bun scripts/check-marketing-route-manifest.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')))
        with:
          name: public-site-qualified-${{ github.sha }}-${{ github.run_attempt }}
          path: delivery
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  browser-app:
    name: Application browser suite (${{ matrix.suite }})
    needs: [plan, frontend-build]
    if: ${{ !cancelled() && needs.plan.outputs.application == 'true' && needs.frontend-build.result == 'success' }}
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Each shard runs one worker against its own server.
        suite: [1/4, 2/4, 3/4, 4/4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/apps/web/static/image-editor-models/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup
        with:
          go: "true"
          chromium: full
          media: "true"
      - id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "name=$(bun scripts/ci-artifacts.mjs resolve --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --prefix "frontend-public-${GITHUB_SHA}-")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: apps/server/cmd/openpost/public
      - name: Test the canonical application artifact
        env:
          OPENPOST_E2E_PREBUILT: "1"
          DEBUG: pw:browser
          OPENPOST_APP_E2E_SUITE: core
          OPENPOST_APP_E2E_SHARD: ${{ matrix.suite }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/openpost-app-timings.json
        run: bun run test -- e2e-app
      - name: Retain application test timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-test-timings-${{ strategy.job-index }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openpost-app-timings.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain application browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-app-failure-${{ strategy.job-index }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  browser-handoff:
    name: Application tool handoff suite
    needs: [plan, frontend-build, public-site]
    if: ${{ !cancelled() && needs.plan.outputs.application == 'true' && needs.frontend-build.result == 'success' && needs.public-site.result == 'success' }}
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/apps/web/static/image-editor-models/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup
        with:
          go: "true"
          chromium: full
      - id: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "frontend=$(bun scripts/ci-artifacts.mjs resolve --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --prefix "frontend-public-${GITHUB_SHA}-")" >> "$GITHUB_OUTPUT"
          echo "marketing=$(bun scripts/ci-artifacts.mjs resolve --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --prefix "marketing-static-${GITHUB_SHA}-")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.artifacts.outputs.frontend }}
          path: apps/server/cmd/openpost/public
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.artifacts.outputs.marketing }}
          path: apps/marketing/dist
      - name: Test free-tool draft handoffs
        env:
          OPENPOST_E2E_PREBUILT: "1"
          DEBUG: pw:browser
          OPENPOST_APP_E2E_SUITE: handoff
        run: bun run test -- e2e-app
      - name: Retain handoff failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-handoff-failure-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  browser-marketing:
    name: Marketing browser suite
    needs: [plan, public-site]
    if: needs.plan.outputs.marketing == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/apps/web/static/image-editor-models/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup
        with:
          chromium: shell
          media: "true"
      - id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "name=$(bun scripts/ci-artifacts.mjs resolve --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --prefix "marketing-static-${GITHUB_SHA}-")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: apps/marketing/dist
      - name: Test the marketing artifact
        env:
          OPENPOST_E2E_PREBUILT: "1"
        run: bun run test -- e2e
      - name: Retain marketing browser failure diagnostics
        if: failure()
        run: |
          mkdir -p marketing-browser-diagnostics
          [ -d "$HOME/.config/.wrangler/logs" ] && cp -R "$HOME/.config/.wrangler/logs" marketing-browser-diagnostics/wrangler-logs || true
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-marketing-failure-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
            marketing-browser-diagnostics
          if-no-files-found: ignore
          retention-days: 7

  packages:
    name: npm and n8n packages
    needs: plan
    if: needs.plan.outputs.npm == 'true' || needs.plan.outputs.n8n == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          node: "true"
      - name: Require a package version increase for publishable changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          NPM: ${{ needs.plan.outputs.npm }}
          N8N: ${{ needs.plan.outputs.n8n }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            BASE_SHA="$(bun scripts/published-release-tag.mjs --exclude "$GITHUB_REF_NAME")"
          elif [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            # Main and nightly candidates compare with the base the next tag ships against.
            BASE_SHA="$(bun scripts/published-release-tag.mjs)"
          fi
          if [[ "$NPM" == true ]]; then
            bun scripts/npm-package-release.mjs check-version --package packages/sdk --base "$BASE_SHA" --head "$GITHUB_SHA"
            bun scripts/npm-package-release.mjs check-version --package packages/cli --base "$BASE_SHA" --head "$GITHUB_SHA"
          fi
          if [[ "$N8N" == true ]]; then
            bun scripts/n8n-package-release.mjs check-version --base "$BASE_SHA" --head "$GITHUB_SHA"
          fi
      - if: needs.plan.outputs.npm == 'true'
        run: |
          bun scripts/tasks.mjs check npm-packages
          (cd packages/sdk && npm pack --dry-run --ignore-scripts)
          (cd packages/cli && npm pack --dry-run --ignore-scripts)
      - if: needs.plan.outputs.n8n == 'true'
        run: |
          bun run check:n8n
          cd packages/n8n-nodes-openpost && npm pack --dry-run --ignore-scripts

  mobile-source:
    name: Native mobile source checks
    needs: plan
    if: needs.plan.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: mobile-${{ runner.os }}-${{ hashFiles('apps/mobile/bun.lock') }}
          restore-keys: mobile-${{ runner.os }}-
      - name: Install and check the standalone mobile app
        working-directory: apps/mobile
        run: |
          bun install --frozen-lockfile
          bun ../../scripts/check-mobile-install.mjs
          bun run check

  android:
    name: Native mobile Android candidate
    needs: plan
    if: needs.plan.outputs.android == 'true' && needs.plan.outputs.mode != 'filtered'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          node: "true"
          install: "false"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "21"
          distribution: temurin
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;27.1.12297006
            cmake;3.22.1
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: on-success
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: mobile-${{ runner.os }}-${{ hashFiles('apps/mobile/bun.lock') }}
          restore-keys: mobile-${{ runner.os }}-
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ccache
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openpost-ccache
          key: android-ccache-ndk27-${{ runner.os }}-${{ hashFiles('apps/mobile/bun.lock') }}-${{ github.sha }}
          restore-keys: android-ccache-ndk27-${{ runner.os }}-${{ hashFiles('apps/mobile/bun.lock') }}-
      - run: echo "CCACHE_DIR=${RUNNER_TEMP}/openpost-ccache" >> "$GITHUB_ENV"
      - name: Install the standalone mobile app and check its release identity
        working-directory: apps/mobile
        run: |
          bun install --frozen-lockfile
          bun ../../scripts/check-mobile-install.mjs
          latest_tag="$(git for-each-ref --count=1 --sort=-version:refname --format='%(refname:short)' 'refs/tags/v*')"
          [[ -n "$latest_tag" ]]
          git show "$latest_tag:apps/mobile/app.json" > previous-release-app.json
          bun ../../scripts/mobile-release.mjs check-current \
            --config app.json \
            --package package.json \
            --previous-config previous-release-app.json
      - name: Build the native Expo Android candidate
        working-directory: apps/mobile
        run: bun run build:android:candidate
      - run: |
          cp apps/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk openpost-app-android-unsigned.apk
          unzip -t openpost-app-android-unsigned.apk
          sha256sum openpost-app-android-unsigned.apk > openpost-app-android-unsigned.sha256
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks apps/mobile/android/app/debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out openpost-app-android-preview.apk \
            openpost-app-android-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose openpost-app-android-preview.apk
          sha256sum openpost-app-android-preview.apk > openpost-app-android-preview.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-unsigned-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            openpost-app-android-unsigned.apk
            openpost-app-android-unsigned.sha256
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-preview-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            openpost-app-android-preview.apk
            openpost-app-android-preview.sha256
          if-no-files-found: error
          retention-days: 14

  image:
    name: Production image (linux/${{ matrix.arch }})
    needs: [plan, frontend-build]
    if: needs.plan.outputs.image == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/apps/web/static/image-editor-models/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "name=$(bun scripts/ci-artifacts.mjs resolve --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --prefix "frontend-public-${GITHUB_SHA}-")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: apps/server/cmd/openpost/public
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: github.event_name == 'push'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image version
        id: version
        shell: bash
        run: |
          version="sha-${GITHUB_SHA}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
            bun scripts/release-notes.mjs "$version" >/dev/null
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build and smoke the candidate once
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}-${{ matrix.arch }}"
          docker buildx build --load --platform "linux/${{ matrix.arch }}" --build-context frontend_artifact=apps/server/cmd/openpost/public --file deploy/docker/Dockerfile --tag "$image" --build-arg VERSION="${{ steps.version.outputs.version }}" --build-arg COMMIT="$GITHUB_SHA" --cache-from type=gha,scope="openpost-production-${{ matrix.arch }}" --cache-to type=gha,mode=max,scope="openpost-production-${{ matrix.arch }}" .
          scripts/smoke-production-image.sh "$image" "$GITHUB_SHA" "${{ steps.version.outputs.version }}" "${{ matrix.arch }}"
      - name: Generate the final-image SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}-${{ matrix.arch }}
          scan-type: image
          scanners: vuln
          format: spdx-json
          output: openpost-image-${{ matrix.arch }}.spdx.json
          version: v0.70.0
      - name: Record the full final-image vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}-${{ matrix.arch }}
          scan-type: image
          scanners: vuln
          format: json
          output: openpost-image-${{ matrix.arch }}-trivy.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 0
          version: v0.70.0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-diagnostics-${{ github.sha }}-${{ matrix.arch }}-${{ github.run_attempt }}
          path: |
            openpost-image-${{ matrix.arch }}.spdx.json
            openpost-image-${{ matrix.arch }}-trivy.json
          if-no-files-found: error
          retention-days: 14
      - name: Block fixable high-severity vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}-${{ matrix.arch }}
          scan-type: image
          scanners: vuln
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
          version: v0.70.0
      - name: Publish the validated candidate and record its digest
        if: github.event_name == 'push'
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}-${{ matrix.arch }}"
          docker push "$image"
          raw_manifest="$(docker buildx imagetools inspect --raw "$image")"
          if jq -e 'has("manifests")' <<< "$raw_manifest" >/dev/null; then
            digest="$(jq -r --arg architecture "${{ matrix.arch }}" '
              [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $architecture)]
              | if length == 1 then .[0].digest else empty end
            ' <<< "$raw_manifest")"
          else
            digest="$(docker buildx imagetools inspect "$image" | awk '$1 == "Digest:" && !found { print $2; found = 1 }')"
          fi
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "Published candidate did not resolve to a registry digest." >&2; exit 1; }
          printf '%s\n' "$digest" > "image-linux-${{ matrix.arch }}-digest.txt"
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-platform-digest-${{ github.sha }}-${{ matrix.arch }}-${{ github.run_attempt }}
          path: image-linux-${{ matrix.arch }}-digest.txt
          if-no-files-found: error
          retention-days: 14

  image-index:
    name: Production image index
    needs: [plan, image]
    if: needs.plan.outputs.image == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/apps/web/static/image-editor-models/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - id: platforms
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for arch in amd64 arm64; do
            echo "${arch}=$(bun scripts/ci-artifacts.mjs resolve --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --prefix "image-platform-digest-${GITHUB_SHA}-${arch}-")" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.platforms.outputs.amd64 }}
          path: tested-platforms
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.platforms.outputs.arm64 }}
          path: tested-platforms
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the multi-architecture candidate
        shell: bash
        run: |
          set -euo pipefail
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          amd64_digest="$(cat tested-platforms/image-linux-amd64-digest.txt)"
          arm64_digest="$(cat tested-platforms/image-linux-arm64-digest.txt)"
          for digest in "$amd64_digest" "$arm64_digest"; do
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "Invalid tested platform digest: $digest" >&2; exit 1; }
          done
          candidate="${repository}:sha-${GITHUB_SHA}"
          docker buildx imagetools create --tag "$candidate" "${repository}@${amd64_digest}" "${repository}@${arm64_digest}"
          digest="$(docker buildx imagetools inspect "$candidate" | awk '$1 == "Digest:" && !found { print $2; found = 1 }')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "Published candidate index did not resolve to a registry digest." >&2; exit 1; }
          docker buildx imagetools inspect --raw "$candidate" | jq -e \
            --arg amd64 "$amd64_digest" \
            --arg arm64 "$arm64_digest" '
              [.manifests[] | select(.platform.os == "linux")] as $linux
              | ($linux | length) == 2
              and any($linux[]; .platform.architecture == "amd64" and .digest == $amd64)
              and any($linux[]; .platform.architecture == "arm64" and .digest == $arm64)
            ' >/dev/null
          printf '%s\n' "$digest" > image-digest.txt
          cp tested-platforms/image-linux-amd64-digest.txt tested-platforms/image-linux-arm64-digest.txt .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            image-digest.txt
            image-linux-amd64-digest.txt
            image-linux-arm64-digest.txt
          if-no-files-found: error
          retention-days: 14

  release-candidate:
    name: Release Candidate
    if: always()
    needs:
      [
        plan,
        web-quality,
        go-quality,
        backend,
        hosted-data-plane,
        frontend-tests,
        frontend-build,
        public-site,
        browser-app,
        browser-handoff,
        browser-marketing,
        packages,
        mobile-source,
        android,
        image,
        image-index,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every planned check
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          printf 'Job results: %s\n' "$RESULTS"
          [[ "$RESULTS" != *failure* && "$RESULTS" != *cancelled* ]]
